<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 80 80">
<defs>
<filter id="ds" x="-25%" y="-15%" width="150%" height="160%">
<feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".4"/>
</filter>
<filter id="eglow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="3"/>
</filter>
<radialGradient id="n1" cx="35%" cy="30%" r="60%"><stop offset="0%" stop-color="#e8fff0"/><stop offset="50%" stop-color="#7ee89d"/><stop offset="100%" stop-color="#3cb85e"/></radialGradient><radialGradient id="n2" cx="35%" cy="30%" r="60%"><stop offset="0%" stop-color="#ffe8ec"/><stop offset="50%" stop-color="#f0808e"/><stop offset="100%" stop-color="#d44a5c"/></radialGradient><radialGradient id="n3" cx="35%" cy="30%" r="60%"><stop offset="0%" stop-color="#e4f0ff"/><stop offset="50%" stop-color="#6eaaee"/><stop offset="100%" stop-color="#3874c4"/></radialGradient><linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff5c0"/><stop offset="40%" stop-color="#ffec88"/><stop offset="100%" stop-color="#c9a830"/></linearGradient>
<radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1e2230"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
</defs>
<!-- Line glow -->
<g opacity=".5" filter="url(#eglow)">
<line x1="24" y1="56" x2="40" y2="20" stroke="#ffec88" stroke-width="3" stroke-linecap="round"/>
<line x1="40" y1="20" x2="56" y2="56" stroke="#ffec88" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- Gold lines -->
<line x1="24" y1="56" x2="40" y2="20" stroke="url(#goldg)" stroke-width="2.2" stroke-linecap="round"/>
<line x1="40" y1="20" x2="56" y2="56" stroke="url(#goldg)" stroke-width="2.2" stroke-linecap="round"/>
<!-- Nodes -->
<circle cx="40" cy="20" r="10" fill="url(#n1)" filter="url(#ds)" stroke="#fff" stroke-width=".8" stroke-opacity=".35"/>
<circle cx="24" cy="56" r="10" fill="url(#n2)" filter="url(#ds)" stroke="#fff" stroke-width=".8" stroke-opacity=".35"/>
<circle cx="56" cy="56" r="10" fill="url(#n3)" filter="url(#ds)" stroke="#fff" stroke-width=".8" stroke-opacity=".35"/>
<!-- Highlights -->
<ellipse cx="38" cy="17" rx="4" ry="2.5" fill="#fff" opacity=".45"/>
<ellipse cx="22" cy="53" rx="4" ry="2.5" fill="#fff" opacity=".45"/>
<ellipse cx="54" cy="53" rx="4" ry="2.5" fill="#fff" opacity=".45"/>
</svg>
