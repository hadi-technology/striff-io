1.63 2669h645.425v6H3911.63z"/><rect width="645.425" height="214.672" x="3911.63" y="2643" fill="none" stroke="#24292e" rx="6" ry="6"/><circle cx="4166.73" cy="2659" r="11" fill="#add1b2" stroke="#181818"/><path d="M4169.699 2664.64q-.578.298-1.219.438-.64.156-1.344.156-2.5 0-3.828-1.64-1.312-1.657-1.312-4.782t1.312-4.78q1.328-1.657 3.828-1.657.703 0 1.344.156.656.157 1.219.453v2.72q-.625-.579-1.219-.845-.594-.28-1.219-.28-1.343 0-2.03 1.077-.688 1.063-.688 3.157 0 2.093.687 3.171.688 1.063 2.031 1.063.625 0 1.22-.266.593-.281 1.218-.86z"/><text x="4187.23" y="2663.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="93.522">SessionEvent</text><text x="4285.203" y="2663.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="28.752">(...)</text><path stroke="#24292e" d="M3912.63 2675h643.425"/><text x="3917.63" y="2691.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="415.228">An atomic unit in the session&apos;s conversation history.</text><text x="4337.733" y="2691.995" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="105.472">SessionEvent</text><text x="4448.078" y="2691.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="63.752">is a thin</text><text x="3917.63" y="2708.292" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="303.153">wrapper around the existing Spring AI</text><text x="4225.657" y="2708.292" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="69.057">Message</text><text x="4299.588" y="2708.292" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="235.04">types. There is no duplication</text><text x="3917.63" y="2724.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="285.688">of content structures — the existing</text><text x="4208.191" y="2724.589" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="105.157">UserMessage</text><text x="4313.349" y="2724.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="5.318">,</text><text x="4323.541" y="2724.589" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="142.488">AssistantMessage</text><text x="4466.029" y="2724.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="5.318">,</text><text x="3917.63" y="2740.886" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="127.374">SystemMessage</text><text x="4045.004" y="2740.886" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="39.628">, and</text><text x="4089.506" y="2740.886" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="178.685">ToolResponseMessage</text><text x="4273.065" y="2740.886" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="258.07">classes carry the actual content.</text><text x="3917.63" y="2757.183" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="105.472">SessionEvent</text><text x="4027.976" y="2757.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="120.121">adds only what</text><text x="4152.971" y="2757.183" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="69.057">Message</text><text x="4226.901" y="2757.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="300.535">intentionally lacks: identity, ordering,</text><text x="3917.63" y="2773.479" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="553.554">session-level provenance, and agent-branch attribution. The wrapped</text><text x="4476.058" y="2773.479" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="69.057">Message</text><text x="3917.63" y="2789.776" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="303.174">already encodes the event type via its</text><text x="4225.678" y="2789.776" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="107.249">MessageType</text><text x="4332.927" y="2789.776" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="5.599">:</text><text x="4343.4" y="2789.776" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="105.157">UserMessage</text><text x="4453.431" y="2789.776" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="97.624">→ user input</text><text x="3917.63" y="2806.073" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="124.305">**&lt;back:#E6E6...</text><text x="3917.63" y="2822.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M3917.63 2825.672h44.1v18h-44.1z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="255" y="150" fill="#010101" fill-opacity=".3" textLength="390" transform="matrix(.09 0 0 .09 3917.63 2825.672)">NOC: 0</text><text x="255" y="140" textLength="390" transform="matrix(.09 0 0 .09 3917.63 2825.672)">NOC: 0</text></g><text x="3977.63" y="2842.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path f