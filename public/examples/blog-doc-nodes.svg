Liberation Mono" font-size="14" font-weight="bold" textLength="130.669">EventFilter#all[]</text><text x="3630.695" y="2757.292" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="215.414">when no setters are called.</text><text x="3341.63" y="2773.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M3341.63 2776.89h44.1v18h-44.1z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="255" y="150" fill="#010101" fill-opacity=".3" textLength="390" transform="matrix(.09 0 0 .09 3341.63 2776.89)">NOC: 0</text><text x="255" y="140" textLength="390" transform="matrix(.09 0 0 .09 3341.63 2776.89)">NOC: 0</text></g><text x="3401.63" y="2793.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M3406.08 2776.89h38.7v18h-38.7z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="225" y="150" fill="#010101" fill-opacity=".3" textLength="330" transform="matrix(.09 0 0 .09 3406.08 2776.89)">DIT: 1</text><text x="225" y="140" textLength="330" transform="matrix(.09 0 0 .09 3406.08 2776.89)">DIT: 1</text></g><text x="3460.08" y="2793.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M3464.53 2776.89h53.1v18h-53.1z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="305" y="150" fill="#010101" fill-opacity=".3" textLength="490" transform="matrix(.09 0 0 .09 3464.53 2776.89)">WMC: 12</text><text x="305" y="140" textLength="490" transform="matrix(.09 0 0 .09 3464.53 2776.89)">WMC: 12</text></g><text x="3534.53" y="2793.589" font-family="Consolas,Menlo,Liberation Mono" font