"14" font-weight="bold" textLength="190.353">Persistence contract for</text><text x="4020.858" y="1581.495" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="60.628">Session</text><text x="4086.36" y="1581.495" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="365.497">objects and their event logs. Implementations</text><text x="3825.63" y="1597.792" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="650.774">must be thread-safe. Events are stored separately from session metadata and are</text><text x="3825.63" y="1614.089" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="626.801">mutated via dedicated methods to keep session metadata immutable. @author</text><text x="3825.63" y="1630.386" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="231.417">Christian Tzolov @since 2.0.0</text><path stroke="#24292e" d="M3820.63 1637.688h660.774"/><path fill="#24292e" d="M3825.63 1641.688h47.7v18h-47.7z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="275" y="150" fill="#010101" fill-opacity=".3" textLength="430" transform="matrix(.09 0 0 .09 3825.63 1641.688)">WMC: 0</text><text x="275" y="140" textLength="430" transform="matrix(.09 0 0 .09 3825.63 1641.688)">WMC: 0</text></g><text x="3889.63" y="1658.386" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><g transform="translate(3894.08 1641.688)"><linearGradient id="d" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><path fill="#24292e" d="M0 0h35.1v18H0z"/><path fill="#bef5cb" d="M35.1 0h38.7v18H35.1z"/><path fill="url(#d)" d="M0 0h82v20H0z" transform="scale(.9)"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="205" y="150" fill="#010101" fill-opacity=".3" textLength="290" transform="scale(.09)">AC: 6</text><text x="205" y="140" textLength="290" transform="scale(.09)">AC: 6</text><text x="595" y="140" fill="#000" textLength="330" transform="scale(.09)">+20%</text></g></g><text x="3976.08" y="1658.386" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M3980.53 1641.688h35.1v18h-35.1z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="205" y="150" fill="#010101" fill-opacity=".3" textLength="290" transform="matrix(.09 0 0 .09 3980.53 1641.688)">EC: 8</text><text x="205" y="140" textLength="290" transform="matrix(.09 0 0 .09 3980.53 1641.688)">EC: 8</text></g><path stroke="#24292e" d="M3820.63 1665.688h660.774"/><path fill="#a0a0a0" stroke="#a0a0a0" d="m3830.63 1675.336-4 6h8z" data-visibility-modifier="PACKAGE_PRIVATE_METHOD"/><text x="3839.63" y="1682.683" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="96.811">delete(String)</text><path fill="#a0a0a0" stroke="#a0a0a0" d="m3830.63 1691.633-4 6h8z" data-visibility-modifier="PACKAGE_PRIVATE_METHOD"/><text x="3839.63" y="1698.979" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="164.144">save(Session) : Session</text><path fill="#a0a0a0" stroke="#a0a0a0" d="m3830.63 1707.93-4 6h8z" data-visibility-modifier="PACKAGE_PRIVATE_METHOD"/><text x="3839.63" y="1715.276" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="366.454">findEvents(String, EventFilter) : List&lt;SessionEvent&gt;</text><path fill="#a0a0a0" stroke="#a0a0a0" d="m3830.63 1724.227-4 6h8z" data-visibility-modifier="PACKAGE_PRIVATE_METHOD"/><text x="3839.63" y="1731.573" font-family="Consolas,Menlo,Liberation Mono" font-size="14"