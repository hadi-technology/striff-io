tity.js",</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="331.6113" x="1407.374" y="2866.7764">optional "prependString": "Context note",</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="220.9307" x="1748.7334" y="2866.7764">optional; not for permission</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="589.292" x="1402.5" y="2883.0732">hooks "appendString": "Footer note", // optional; not for permission hooks</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="499.5225" x="1402.5" y="2899.3701">"timeout": 10, "failSilently": true, "async": false, "capabilities":</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="524.3574" x="1402.5" y="2915.667">["filesystem"], // optional; opt-in host access for .js hooks "env": {</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="462.7109" x="1402.5" y="2931.9639">"LOG_LEVEL": "INFO" &lt;/back&gt; } } @param script path to...</text><line stroke="#24292E" stroke-width="1" x1="1397.5" x2="2036.9121" y1="2939.2656" y2="2939.2656"/><g transform="translate(1402.5,2943.2656)"><linearGradient id="i_264_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_264_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering=