t="bold" lengthAdjust="spacing" textLength="406.1367" x="3360.9609" y="1380.0889">facade which now only retains static JSONL parsing</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="502.749" x="3145" y="1396.3857">utilities for the migration layer. Callers obtain the singleton via</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174.2139" x="3145" y="1412.6826">#getInstance[Project]</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="235.2314" x="3319.2139" y="1412.6826">. Read operations delegate to</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160.3848" x="3559.3193" y="1412.6826">ConversationReader</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="51.0166" x="3719.7041" y="1412.6826">, write</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106.0801" x="3145" y="1428.9795">operations to</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="154.4785" x="3255.9541" y="1428.9795">ConversationWriter</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.332" x="3410.4326" y="1428.9795">, both backed by the project's</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust