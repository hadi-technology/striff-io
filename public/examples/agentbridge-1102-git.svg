" textLength="5.3184" x="7449.6982" y="1869.3857">,</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="42.4033" x="7459.8906" y="1869.3857">"30s"</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="161.0957" x="7502.2939" y="1869.3857">] or absolute times [</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.0605" x="7663.3896" y="1869.3857">"HH:mm:ss"</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="16.5225" x="7763.3242" y="1869.3857">or</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="195.9658" x="7201" y="1885.6826">"yyyy-MM-dd HH:mm:ss"</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="427.6289" x="7396.9658" y="1885.6826">]. Output is compact: date and thread-id are stripped;</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="385.8271" x="7201" y="1901.9795">the logger is shortened to its simple class name.</text><line stroke="#24292E" stroke-width="1" x1="7196" x2="7829.5947" y1="1909.2813" y2="1909.2813"/><g transform="translate(7201,1913.2813)"><linearGradient id="i_156_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_156_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#2429