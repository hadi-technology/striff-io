ont-size="14" lengthAdjust="spacing" textLength="4.4502" x="6812.8506" y="683.0889">&#160;</text><g transform="translate(6817.3008,666.3906)"><linearGradient id="i_178_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_178_r"><rect width="50" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="39" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">AC: 0</text><text x="205" y="140" transform="scale(.1)" textLength="290">AC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="6867.3008" y="683.0889">&#160;</text><g transform="translate(6871.751,666.3906)"><linearGradient id="i_179_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_179_r"><rect width="50" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="39" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">EC: 0</text><text x="205" y="140" transform="scale(.1)" textLength="290">EC: 0</text></g></g><line stroke="#24292E" stroke-width="1" x1="6558.5" x2="7137.79" y1="690.3906" y2="690.3906"/></g><!--class com-github-catatafishen-agentbridge-psi-tools-testing-TestExecutionTracker--><g class="entity" data-qualified-name="com.github.catatafishen.agentbridge.psi.tools.testing.TestExecutionTracker" data-source-line="448" id="ent0042"><rect fill="#F8F8F8" height="442.5313" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="665.3516" x="6473.5" y="1180"/><rect fill="#24292E" height="32" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="665.3516" x="6473.5" y="1180"/><rect fill="#24292E" height="2.5" stroke="#24292E" stroke-width="1" width="665.3516" x="6473.5" y="1209.5"/><rect fill="none" height="442.5313" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="665.3516" x="6473.5" y="1180"/><ellipse cx="6693.0806" cy="1196" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1"/><path d="M6696.0493,1201.6406 Q6695.4712,1201.9375 6694.8306,1202.0781 Q6694.1899,1202.2344 6693.4868,1202.2344 Q6690.9868,1202.2344 6689.6587,1200.5938 Q6688.3462,1198.9375 6688.3462,1195.8125 Q6688.3462,1192.6875 6689.6587,1191.0313 Q6690.9868,1189.375 6693.4868,1189.375 Q6694.1899,1189.375 6694.8306,1189.5313 Q6695.4868,1189.6875 6696.0493,1189.9844 L6696.0493,1192.7031 Q6695.4243,1192.125 6694.8306,1191.8594 Q6694.2368,1191.5781 6693.6118,1191.5781 Q6692.2681,1191.5781 6691.5806,1192.6563 Q6690.8931,1193.7188 6690.8931,1195.8125 Q6690.8931,1197.9063 6691.5806,1198.9844 Q6692.2681,1200.0469 6693.6118,1200.0469 Q6694.2368,1200.0469 6694.8306,1199.7813 Q6695.4243,1199.5 6696.0493,1198.9219 L6696.0493,1201.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="162.0527" x="6713.5806" y="1200.8467">TestExecutionTracker [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="6880.0835" y="1200.8467">+2</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="6900.7212" y="1200.8467">&#160;</text><text fill="#B3E3F5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="6905.1714" y="1200.8467">+1</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="5.4619" x="6925.8091" y="1200.8467">]</text><line stroke="#24292E" stroke-width="1" x1="6474.5" x2="7137.8516" y1="1212" y2="1212"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="228.8535" x="6479.5" y="1228.9951">Correlates a run launched by</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="73.3838" x="6713.2275" y="1228.9951">run_tests</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="308.0137" x="6791.4854" y="1228.9951">with the platform execution event that</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78.8799" x="6479.5" y="1245.292">carries its</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123.5938" x="6563.2539" y="1245.292">ProcessHandler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="353.2539" x="6686.8477" y="1245.292">, so the tool can wait for the tests instead of</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="640.0967" x="6479.5" y="1261.5889">returning as soon as they are launched. Matching on the run configuration name</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="151.498" x="6479.5" y="1277.8857">alone is unreliable:</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="99.9277" x="6635.8721" y="1277.8857">RunManager</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="392.1777" x="6740.6738" y="1277.8857">may rename a temporary configuration when one</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="609.7383" x="6479.5" y="1294.1826">of the same name already exists, so re-running the same target produced an</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="578.2178" x="6479.5" y="1310.4795">execution event the tool did not recognise &#8212; it then gave up waiting and</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="624.7158" x="6479.5" y="1326.7764">reported "could not capture process handle" while the tests were still running.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="105.8477" x="6479.5" y="1343.0732">The launched</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.6807" x="6590.2217" y="1343.0732">RunProfile</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="381.4453" x="6677.7764" y="1343.0732">is therefore compared by identity, which cannot</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="615.9521" x="6479.5" y="1359.3701">collide, with the name kept as a fallback for launches that never publish their</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="57.0459" x="6479.5" y="1375.667">profile.</text><line stroke="#24292E" stroke-width="1" x1="6474.5" x2="7137.8516" y1="1382.9688" y2="1382.9688"/><g transform="translate(6479.5,1386.9688)"><linearGradient id="i_180_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_180_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">NOC: 0</text><text x="255" y="140" transform="scale(.1)" textLength="390">NOC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="6539.5" y="1403.667">&#160;</text><g transform="translate(6543.9502,1386.9688)"><linearGradient id="i_181_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_181_r"><rect width="54" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="43" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="225" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330">DIT: 1</text><text x="225" y="140" transform="scale(.1)" textLength="330">DIT: 1</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberat