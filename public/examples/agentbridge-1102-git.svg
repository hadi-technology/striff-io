2">. A real git</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.6299" x="9912" y="1347.0889">repository is initialised inside</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="213.7119" x="10151.5039" y="1347.0889">getProject[].getBasePath[]</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="51.6797" x="10370.0898" y="1347.0889">during</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="70.4375" x="10426.6436" y="1347.0889">#setUp[]</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="626.3018" x="9912" y="1363.3857">so that every process-based git command has a valid working tree and at least</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="385.1982" x="9912" y="1379.6826">one commit to operate on. JUnit 3 style [extends</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="177.9668" x="10302.0723" y="1379.6826">BasePlatformTestCase</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="48.084" x="10480.0391" y="1379.6826">]: test</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="137.5596" x="9912" y="1395.9795">methods must be</text><text fill="#000000" filter="url(#b17g7ie5br6