><line stroke="#24292E" stroke-width="1" x1="5004" x2="5643.7607" y1="872" y2="872"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="619.835" x="5009" y="888.9951">Queries conversation history with SQL-backed filtering and returns structured</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="613.0811" x="5009" y="905.292">turn summaries. Default retrieval [no params]: 5 most recent turns across all</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="571.3203" x="5009" y="921.5889">sessions. Each turn is identified by a stable UUID &#8212; no fragile positional</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="6.6924" x="5585.1943" y="921.5889">t</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="64.5518" x="5009" y="937.8857">IDs. Use</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="97.8975" x="5078.4258" y="937.8857">prev_turn_id</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="446.5166" x="5181.1973" y="937.8857">from any turn to navigate backwards in history. Content</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="397.1406" x="5009" y="954.1826">filters search the SQLite conversation DB directly:</text><text fill="#000000" filter="url(#b17g7ie5br6pml0)" font-family="Consolas,Menlo,Liberation 