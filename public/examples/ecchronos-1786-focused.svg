n.bss.cassandra.ecchronos.core.impl.multithreads.NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.5236" x="930.864" y="1937.0339">threads and the</text><text fill="#000000" filter="url(#bithbz2dy6yu13)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="114.7996" x="400" y="1956.1018">RepairScheduler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349.9286" x="514.7996" y="1956.1018">. There are two tracks: Per-node track &#8212; driven by</text><text fill="#000000" filter="url(#bithbz2dy6yu13)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="89.0537" x="868.3682" y="1956.1018">NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="115.7236" x="961.0619" y="1956.1018">threads [one per</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="713.6055" x="400" y="1975.1697">managed node]. It handles only non-incremental repair configurations, which are inherently per-node</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="688.0136" x="400" y="1994.2376">[vnode / parallel vnode]. Global incremental track &#8212; driven directly by the schema-change listener</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="723.0974" x="400" y="2013.3055">without going through the per-node worker threads. It handles only incremental repair configurations,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="668.5817" x="400" y="2032.3734">of which there is a single logical job per table. It resolves the configuration once and hands it to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="285.7108" x="400" y="2051.4414">**the scheduler on any managed node; the</text><text fill="#000000" filter="url(#bithbz2dy6yu13)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="132.4395" x="689.3508" y="2051.4414">RepairScheduler&lt;/...</text><line stroke="#24292E" stroke-width="1"  x1="395" x2="1128.0974" y1="2059.5433" y2="2059.5433"/><g transform="translate(400,2063.5433)"><svg width="64" height="20"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="64" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">NOC: 0</text><text x="245" y="140" transform="scale(.1)" textLength="370">NOC: 0</text></g></svg></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="464" y="2079.4414">&#160;</text><g transform="translate(467.64,2063.5433)"><svg width="56" height="20"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="56" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="39" height="20" fill="#24292E"/></g><g fill="#fff" t