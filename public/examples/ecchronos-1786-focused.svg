2.5" stroke="#24292E" stroke-width="1"  width="567.7981" x="757.5" y="7"/><ellipse cx="926.8575" cy="23" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1" /><path d="M929.8262,28.6406 Q929.2481,28.9375 928.6075,29.0781 Q927.9668,29.2344 927.2637,29.2344 Q924.7637,29.2344 923.4356,27.5938 Q922.1231,25.9375 922.1231,22.8125 Q922.1231,19.6875 923.4356,18.0313 Q924.7637,16.375 927.2637,16.375 Q927.9668,16.375 928.6075,16.5313 Q929.2637,16.6875 929.8262,16.9844 L929.8262,19.7031 Q929.2012,19.125 928.6075,18.8594 Q928.0137,18.5781 927.3887,18.5781 Q926.045,18.5781 925.3575,19.6563 Q924.67,20.7188 924.67,22.8125 Q924.67,24.9063 925.3575,25.9844 Q926.045,27.0469 927.3887,27.0469 Q928.0137,27.0469 928.6075,26.7813 Q929.2012,26.5 929.8262,25.9219 L929.8262,28.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="151.5634" x="947.3575" y="28.432">IncrementalRepairJob [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.0159" x="1102.5609" y="28.432">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="1118.5768" y="28.432">&#160;</text><text fill="#B3E3F5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.0159" x="1122.2168" y="28.432">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.606" x="1138.2327" y="28.432">]</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="21.4619" x="1146.4787" y="28.432">(...)</text><line stroke="#24292E" stroke-width="1"  x1="758.5" x2="1324.2981" y1="39" y2="39"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="555.7981" x="763.5" y="57.9659">A scheduled job that keeps a single table repaired using Cassandra incremental</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="541.5178" x="763.5" y="77.0339">repairs. One job is created per managed node per table [same as vnode]. Each</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71.2177" x="763.5" y="96.1018">job: Reads</text><text fill="#000000" filter="url(#b1obwn4vjc7taw0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173.5154" x="838.3577" y="96.1018">ecchronos.repair_history</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="283.9749" x="1015.5131" y="96.1018">keyed by this node's ID to determine the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340.4507" x="763.5" y="115.1697">last successful run, falling back to the Cassandra</text><text fill="#000000" filter="url(#b1obwn4vjc7taw0)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6256" x="1107.5907" y="115.1697">maxRepairedAt</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="88.2137" x="1219.8562" y="115.1697">metric when</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="549.8761" x="763.5" y="134.2376">no history exists. On completion, writes one history row per replica involved in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="537.6121" x="763.5" y="153.3055">the repair so that all nodes can observe the result and avoid redundant work</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175.7553" x="763.5" y="172.3734">within the same interval.</text><line stroke="#24292E" stroke-width="1"  x1="758.5" x2="1324.2981" y1="180.4754" y2="180.4754"/><g transform="translate(763.5,184.4754)"><svg width="64" height="20"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="64" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">NOC: 0</text><text x="245" y="140" transform="scale(.1)" textLength="370">NOC: 0</text></g></svg></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="827.5" y="200.3734">&#160;</text><g transform="translate(831.14,184.4754)"><svg width="56" height="20"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="56" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="39" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">DIT: 3</text><text x="205" y="140" t