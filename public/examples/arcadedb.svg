ight="130.9141" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="451.6055" x="7" y="1256"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="192.5308" x="136.5374" y="1273.0669">&#127919;&#160;P1&#160;Stable&#160;contract&#160;modified</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="457.6055" y1="1281.1328" y2="1281.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="13" y="1298.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="108.6826" y="1298.1279">&#160;</text><text fill="#000000" filter="url(#biceo5bx05mk02)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="186.0332" x="113.1328" y="1298.1279">RemoteHttpComponent</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="148.9893" x="303.6162" y="1298.1279">has afferent coupling</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="381.3564" x="13" y="1314.4248">of 10 &#8212; changes to this component impact at least 10</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="230.0908" x="13" y="1330.7217">dependents in the parsed scope.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="13" y="1347.0186">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="104.6035" x="70.3945" y="1347.0186">Review the API</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="383.585" x="13" y="1363.3154">contract changes for backward compatibility. Consider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="306.1133" x="13" y="1379.6123">a deprecation path for removed signatures.</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="151" id="ent0019"><rect fill="#FEF2F2" height="244.9922" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="462.4883" x="1090" y="7"/><rect fill="#FECACA" height="25.1328" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="462.4883" x="1090" y="7"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="462.4883" x="1090" y="26.1328"/><rect fill="none" height="244.9922" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="462.4883" x="1090" y="7"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="157.5044" x="1242.4919" y="24.0669">&#127919;&#160;P1&#160;New&#160;package&#160;cycle</text><line stroke="#F9A825" stroke-width="1" x1="1091" x2="1551.4883" y1="32.1328" y2="32.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="1096" y="49.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="228.5596" x="1196.1328" y="49.1279">Package-level dependency cycle</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="341.7217" x="1096" y="65.4248">detected involving components this PR changes:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="393.873" x="1096" y="81.7217">com.arcadedb.gremlin.service -&gt; com.arcadedb.remote</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-siz