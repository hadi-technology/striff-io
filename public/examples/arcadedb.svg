00" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="13" y="1467.9436">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="253.973" x="62.8958" y="1467.9436">Verify that the removed methods were</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="333.0308" x="13" y="1487.0115">not critical and that the class is not being hollowed</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="298.6328" x="13" y="1506.0795">out in a way that shifts complexity elsewhere.</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="151" id="ent0019"><rect fill="#FEF2F2" height="283.5889" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="410.9985" x="987" y="7"/><rect fill="#FECACA" height="27.706" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="410.9985" x="987" y="7"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="410.9985" x="987" y="28.706"/><rect fill="none" height="283.5889" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="410.9985" x="987" y="7"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="137.1371" x="1123.9307" y="25.897">&#127919;&#160;P1&#160;New&#160;package&#160;cycle</text><line stroke="#F9A825" stroke-width="1" x1="988" x2="1396.9985" y1="34.706" y2="34.706"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="993" y="53.672">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="209.5651" x="1080.7797" y="53.672">Package-level dependency cycle</text><text fi