t><g transform="translate(376.251,120)"><linearGradient id="i_47_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_47_r"><rect width="82" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="45" height="20" fill="#24292E"/><rect x="45" width="37" height="20" fill="#bef5cb"/><rect width="82" height="20" fill="url(#i_47_s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="235" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="350">EC: 31</text><text x="235" y="140" transform="scale(.1)" textLength="350">EC: 31</text><text x="625" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="270"></text><text fill="#000" x="625" y="140" transform="scale(.1)" textLength="270">+3%</text></g></g><line stroke="#24292E" stroke-width="1" x1="47" x2="479.2285" y1="144" y2="144"/><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="57" cy="157.6484" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b15cl2got9dxih1)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="260.1621" x="66" y="160.9951">testClientSearchWorks_ByMobileNo()</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="57" cy="173.9453" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b15cl2got9dxih1)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="408.2285" x="66" y="177.292">testClientSearchOrderByRejectsSnakeCaseColumnName()</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="57" cy="190.2422" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b15cl2got9dxih1)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="298.7988" x="66" y="193.5889">testClientSearchWorks_ByClientIdentifier()</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="147" id="ent0018"><rect fill="#FFFBEB" height="212.3984" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="413.1602" x="1838.5" y="36.5"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="413.1602" x="1838.5" y="36.5"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="413.1602" x="1838.5" y="55.6328"/><rect fill="none" height="212.3984" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="413.1602" x="1838.5" y="36.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="299.9014" x="1895.1294" y="53.5669">&#9888;&#65039;&#160;Review&#160;Hotspot&#160;Package&#160;structure&#160;violation</text><line stroke="#F9A825" stroke-width="1" x1="1839.5" x2="2250.6602" y1="61.6328" y2="61.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="1844.5" y="78.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1940.1826" y="78.6279">&#160;</text><text fill="#000000" filter="url(#b15cl2got9dxih2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="268.1807" x="1944.6328" y="78.6279">DefaultCommandHandlerManager</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="28.3965" x="2217.2637" y="78.6279">is in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="374.1514" x="1844.5" y="94.9248">the 'implementation' package, but REFACTORING.md</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="347.71" x="1844.5" y="111.2217">explicitly requires command handlers to reside in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="327.3594" x="1844.5" y="127.5186">the 'handler' package. This PR adds significant</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="355.332" x="1844.5" y="143.8154">complexity (WMC +10) to this component, making</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="314.2549" x="1844.5" y="160.1123">it a candidate for refactoring into the correct</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="63.7998" x="1844.5" y="176.4092">package.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="1844.5" y="192.7061">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="37.543" x="1901.8945" y="192.7061">Move</text><text fill="#000000" filter="url(#b15cl2got9dxih2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="268.1807" x="1943.8877" y="192.7061">DefaultCommandHandlerManager</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="358.4697" x="1844.5" y="209.0029">to org.apache.fineract.command.handler. Consider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="280.9092" x="1844.5" y="225.2998">splitting its logic into smaller, dedicated</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="224.5742" x="1844.5" y="241.5967">handler classes to reduce WMC.</text></g><!--link org-apache-fineract-command-implementation-DefaultCommandHandlerManager to org-apache-fineract-command-core-exception-CommandHandlerInvalidRequestTypeException--><g class="link" data-entity-1="ent0012" data-entity-2="ent0010" data-link-type="dependency" data-source-line="130" id="lnk15"><path codeLine="130" d="M1219.01,465.59 C1166.22,491.19 1114.9784,516.0414 1070.0984,537.8114" fill="none" id="org-apache-fineract-command-implementation-DefaultCommandHandlerManager-to-org-apache-fineract-command-core-exception-CommandHandlerInvalidRequestTypeException" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1064.7,540.43,1074.5434,540.101,1069.1987,538.2478,1071.0519,532.9031,1064.7,540.43" stroke="#00CC00" stroke-width="1"/></g><!--link org-apache-fineract-command-implementation-DefaultCommandHandlerManager to org-apache-fineract-command-core-exception-CommandHandlerDuplicateException--><g class="link" data-entity-1="ent0012" data-entity-2="ent0009" data-link-type="dependency" data-source-line="131" id="lnk16"><path codeLine="131" d="M1410.28,465.59 C1420.58,491.14 1429.3753,512.9857 1438.1453,534.7257" fill="none" id="org-apache-fineract-command-implementation-DefaultCommandHandlerManager-to-org-apache-fineract-command-core-exception-CommandHandlerDuplicateException" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1440.39,540.29,1440.7325,530.4471,1438.5194,535.6531,1433.3135,533.44,1440.39,540.29" stroke="#00CC00" stroke-width="1"/></g><!--link org-apache-fineract-command-DefaultCommandHandlerManagerTest to org-apache-fineract-command-implementation-DefaultCommandHandlerManager--><g class="link" data-entity-1="ent0007" data-entity-2="ent0012" data-link-type="dependency" data-source-line="132" id="lnk17"><path codeLine="132" d="M1234.27,201.28 C1259.4,233.36 1287.