nlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="5196" y="150.2739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="254.533" x="5283.7797" y="150.2739">New dependency from observability to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="340.3807" x="5196" y="169.3419">routing-tuner types creates coupling to Dolt-backed</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="336.4608" x="5196" y="188.4098">persistence, contradicting the architecture's design</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="166.5714" x="5196" y="207.4777">for intrinsic observability.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="5196" y="226.5456">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="58.5758" x="5245.8958" y="226.5456">Consider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="318.1768" x="5196" y="245.6135">isolating query interfaces in a shared contract to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="295.5108" x="5196" y="264.6814">avoid direct import paths between packages.</text></g><!--link src-services-module-routing-tuner to src-services-routing-tuner-AgentTierOutcomeRow--><g class="link" data-entity-1="ent0021" data-entity-2="ent0014" data-link-type="dependency" data-source-line="368" id="lnk38"><path codeLine="368" d="M1045.41,969.272 C1017.12,988.252 989.4,1008.352 964,1029.102 C946