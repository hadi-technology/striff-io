="spacing" textLength="161.0957" x="16959.6109" y="1253.8467">IncrementalRepairJob [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="17125.1568" y="1253.8467">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17145.7945" y="1253.8467">&#160;</text><text fill="#B3E3F5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="17150.2447" y="1253.8467">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="5.4619" x="17170.8824" y="1253.8467">]</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.752" x="17180.7945" y="1253.8467">(...)</text><line stroke="#24292E" stroke-width="1" x1="16746.9" x2="17389.7574" y1="1265" y2="1265"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="632.8574" x="16751.9" y="1281.9951">A scheduled job that keeps a single table repaired using Cassandra incremental</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="622.5215" x="16751.9" y="1298.292">repairs. One job is created per managed node per table [same as vnode]. Each</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="82.9883" x="16751.9" y="1314.5889">job: Reads</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="195.8291" x="16839.7623" y="1314.5889">ecchronos.repair_history</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="322.9775" x="17040.4654" y="1314.5889">keyed by this node's ID to determine the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389.1016" x="16751.9" y="1330.8857">last successful run, falling back to the Cassandra</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="121.5566" x="17145.8756" y="1330.8857">maxRepairedAt</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.0137" x="17272.3063" y="1330.8857">metric when</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="625.6318" x="16751.9" y="1347.1826">no history exists. On completion, writes one history row per replica involved in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="611.0645" x="16751.9" y="1363.4795">the repair so that all nodes can observe the result and avoid redundant work</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="198.3447" x="16751.9" y="1379.7764">within the same interval.</text><line stroke="#24292E" stroke-width="1" x1="16746.9" x2="17389.7574" y1="1387.0781" y2="1387.0781"/><g transform="translate(16751.9,1391.0781)"><linearGradient id="i_72_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_72_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" t