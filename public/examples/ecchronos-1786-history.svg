l-repair-SchemaRefresher--><g class="entity" data-qualified-name="com.ericsson.bss.cassandra.ecchronos.core.impl.repair.SchemaRefresher" data-source-line="270" id="ent0019"><rect fill="#BEF5CB" height="458.8281" rx="6" ry="6" stroke="#24292E" stroke-width="1" width="826.8574" x="12895.9" y="1929"/><rect fill="#24292E" height="32" rx="6" ry="6" stroke="#24292E" stroke-width="1" width="826.8574" x="12895.9" y="1929"/><rect fill="#24292E" height="6" stroke="#24292E" stroke-width="1" width="826.8574" x="12895.9" y="1955"/><rect fill="none" height="458.8281" rx="6" ry="6" stroke="#24292E" stroke-width="1" width="826.8574" x="12895.9" y="1929"/><ellipse cx="13218.1632" cy="1945" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1"/><path d="M13221.1319,1950.6406 Q13220.5538,1950.9375 13219.9132,1951.0781 Q13219.2726,1951.2344 13218.5694,1951.2344 Q13216.0694,1951.2344 13214.7413,1949.5938 Q13213.4288,1947.9375 13213.4288,1944.8125 Q13213.4288,1941.6875 13214.7413,1940.0313 Q13216.0694,1938.375 13218.5694,1938.375 Q13219.2726,1938.375 13219.9132,1938.5313 Q13220.5694,1938.6875 13221.1319,1938.9844 L13221.1319,1941.7031 Q13220.5069,1941.125 13219.9132,1940.8594 Q13219.3194,1940.5781 13218.6944,1940.5781 Q13217.3507,1940.5781 13216.6632,1941.6563 Q13215.9757,1942.7188 13215.9757,1944.8125 Q13215.9757,1946.9063 13216.6632,1947.9844 Q13217.3507,1949.0469 13218.6944,1949.0469 Q13219.3194,1949.0469 13219.9132,1948.7813 Q13220.5069,1948.5 13221.1319,1947.9219 L13221.1319,1950.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="134.374" x="13238.6632" y="1949.8467">SchemaRefresher [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="29.5449" x="13377.4874" y="1949.8467">+15</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="5.4619" x="13407.0323" y="1949.8467">]</text><line stroke="#24292E" stroke-width="1" x1="12896.9" x2="13721.7574" y1="1961" y2="1961"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="432.8311" x="12901.9" y="1977.9951">Decouples schema-change handling from the per-node</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="596.9414" x="12901.9" y="1994.292">com.ericsson.bss.cassandra.ecchronos.core.impl.multithreads.NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="126.1982" x="13503.7154" y="1994.292">threads and the</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="130.4775" x="12901.9" y="2010.5889">RepairScheduler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="399.957" x="13032.3775" y="2010.5889">. There are two tracks: Per-node track &#8212; driven by</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.5264" x="13437.2086" y="2010.5889">NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="132.5078" x="13540.609" y="2010.5889">threads [one per</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="806.4424" x="12901.9" y="2026.8857">managed node]. It handles only non-incremental repair configurations, which are inherently per-node</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="781.4092" x="12901.9" y="2043.1826">[vnode / parallel vnode]. Global incremental track &#8212; driven directly by the schema-change listener</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="814.8574" x="12901.9" y="2059.4795">without going through the per-node worker threads. It handles only incremental repair configurations,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="763.0684" x="12901.9" y="2075.7764">of which there is a single logical job per table. It resolves the configuration once and hands it to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="304.0352" x="12901.9" y="2092.0732">**the scheduler on any managed node; the</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="145.3389" x="13210.3854" y="2092.0732">RepairScheduler&lt;/...</text><line stroke="#24292E" stroke-width="1" x1="12896.9" x2="13721.7574" y1="2099.375" y2="2099.375"/><g transform="translate(12901.9,2103.375)"><linearGradient id="i_66_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_66_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">NOC: 0</text><text x="255" y="140" transform="scale(.1)" textLengt