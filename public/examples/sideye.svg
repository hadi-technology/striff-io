54" x="42.5" y="477.9799">destroyers : (() =&gt; void)[]</text><line stroke="#24292E" stroke-width="1" x1="23.5" x2="590.0961" y1="486.0819" y2="486.0819"/><g data-visibility-modifier="PACKAGE_PRIVATE_METHOD"><polygon fill="#A0A0A0" points="33.5,497.1159,29.5,503.1159,37.5,503.1159" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="105.4476" x="42.5" y="505.0479">hex(any) : string</text><g data-visibility-modifier="PACKAGE_PRIVATE_METHOD"><polygon fill="#A0A0A0" points="33.5,516.1838,29.5,522.1838,37.5,522.1838" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" filter="url(#b1s89ks10dv6f42)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="542.5961" x="42.5" y="524.1158">renderDiffSpans(string, string[], string, string) : Promise&lt;(needle: string) =&gt; string&gt;</text><g data-visibility-modifier="PACKAGE_PRIVATE_METHOD"><polygon fill="#A0A0A0" points="33.5,535.2517,29.5,541.2517,37.5,541.2517" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="188.2713" x="42.5" y="543.1837">toDiff(string, string[]) : string</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="172" id="ent0021"><rect fill="#FFFBEB" height="245.4531" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="422.5485" x="627.5" y="76.602"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="422.5485" x="627.5" y="76.602"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="422.5485" x="627.5" y="98.308"/><rect fill="none" height="245.4531" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="422.5485" x="627.5" y="76.602"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="211.5815" x="732.9835" y="95.499">&#9888;&#65039;&#160;P2&#160;Unusual&#160;aggregation&#160;pattern</text><line stroke="#F9A825" stroke-width="1" x1="628.5" x2="1049.0485" y1="104.308" y2="104.308"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="633.5" y="123.2739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="209.0192" x="721.2797" y="123.2739">adds an aggregation edge from</text><text fill="#000000" filter="url(#b1s89ks10dv6f43)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110.1096" x="933.9389" y="123.2739">ResolvedTheme</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="13.524" x="633.5" y="142.3419">to</text><text fill="#000000" filter="url(#b1s89ks10dv6f43)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="47.5998" x="650.6639" y="142.3419">Theme</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="312.5348" x="701.9037" y="142.3419">that the GNN model scores as structurally weak</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="365.4126" x="633.5" y="161.4098">(0.415). Aggregation suggests ownership, but the token</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="353.1767" x="633.5" y="180.4777">theme is a shared resource; a weak association would</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="380.8685" x="633.5" y="199.5456">be more typical. Combined with 3 incoming dependencies</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="303.9668" x="633.5" y="218.6135">(from context, resolve, and App), this interface</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="222.4591" x="633.5" y="237.6814">becomes a central coupling point.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="633.5" y="256.7494">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="76.5377" x="683.3958" y="256.7494">Replace the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="227.9051" x="633.5" y="275.8173">aggregation (AGGREGATION) from</text><text fill="#000000" filter="url(#b1s89ks10dv6f43)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110.1096" x="865.0451" y="275.8173">ResolvedTheme</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="13.524" x="978.7947" y="275.8173">to</text><text fill="#000000" filter="url(#b1s89ks10dv6f43)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="47.5998" x="995.9586" y="275.8173">Theme</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="361.5066" x="633.5" y="294.8852">with a WEAK_ASSOCIATION (import) if ownership is not</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="279.5789" x="633.5" y="313.9531">required, reducing the structural anomaly.</text></g><!--link src-theme-module-context to src-theme-resolve-ResolvedTheme--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" data-source-line="152" id="lnk15"><path codeLine="152" d="M1848,258.772 C1848,309.042 1848,374.792 1848,423.172" fill="none" id="src-theme-module-context-to-src-theme-resolve-ResolvedTheme" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1848,429.172,1852,420.172,1848,424.172,1844,420.172,1848,429.172" stroke="#00CC00" stroke-width="1"/></g><!--reverse link src-theme-module-dark to src-theme-tokens-Theme--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="composition" data-source-line="153" id="lnk16"><path codeLine="153" d="M2419.1355,529.8262 C2402.9555,571.1562 2375.66,628.722 2330,673.602 C2307.75,695.472 2282.45,715.472 2255.85,733.592" fill="none" id="src-theme-module-dark-backto-src-theme-tokens-Theme" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="2423.51,518.652,2417.598,522.7809,2419.1355,529.8262,2425.0475,525.6973,2423.51,518.652" stroke="#00CC00" stroke-width="1"/></g><!--link src-module-App to src-theme-resolve-ResolvedTheme--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="154" id="lnk17"><path codeLine="154" d="M1378.9,343.792 C1384.22,347.252 1389.59,350.532 1395,353.602 C1452.51,386.182 1513.1302,409.2614 1577.0502,427.9114" fill="none" id="src-module-App-to-src-theme-resolve-ResolvedTheme" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1582.81,429.592,1575.2906,423.2313,1578.0101,428.1915,1573.0499,430.911,1582.81,429.592" stroke="#00CC00" stroke-width="1"/></g><!--reverse link src-theme-resolve-ResolvedTheme to src-theme-tokens-Theme--><g class="link" data-entity-1="ent0009" data-entity-2="ent0008" data-link-type="aggregation" data-source-line="155" id="lnk18"><path codeLine="155" d="M1869.8385,547.1811 C1887.2885,597.9811 1910.59,665.822 1933.82,733.462" fill="none" id="src-theme-resolve-ResolvedTheme-backto-src-theme-tokens-Theme" stroke="#00CC00" stroke-width="1"/><polygon fill="none" 