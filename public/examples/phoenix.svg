tLength="12.5159" x="13" y="2261.651">-&gt;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="314.9568" x="29.1559" y="2261.651">org.apache.phoenix.compile.HavingCompiler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="12.5159" x="13" y="2280.7189">-&gt;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="307.4108" x="29.1559" y="2280.7189">org.apache.phoenix.compile.UnionCompiler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="12.5159" x="13" y="2299.7869">-&gt;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="308.7828" x="29.1559" y="2299.7869">org.apache.phoenix.compile.OffsetCompiler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="194.8652" x="13" y="2318.8548">-&gt; org.apache.phoenix.jdbc -&gt;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="318.1489" x="13" y="2337.9227">org.apache.phoenix.schema.types.PDataType</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="12.5159" x="13" y="2356.9906">-&gt;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="301.9509" x="29.1559" y="2356.9906">org.apache.phoenix.compile.FromCompiler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="218.2311" x="13" y="2376.0585">-&gt; org.apache.phoenix.schema -&gt;</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="250.039" x="13" y="2395.1264">org.apache.phoenix.mapreduce.index</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="13" y="2414.1944">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="63.3497" x="62.8958" y="2414.1944">Break the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="315.3908" x="13" y="2433.2623">cycle by extracting a shared interface or moving</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="245.5171" x="13" y="2452.3302">common logic to a separate package.</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="280" id="ent0040"><rect fill="#FFFBEB" height="378.9285" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="406.5745" x="2815" y="1814.602"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="406.5745" x="2815" y="1814.602"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="406.5745" x="2815" y="1836.308"/><rect fill="none" height="378.9285" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="406.5745" x="2815" y="1814.602"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="298.6685" x="2868.953" y="1833.499">&#9888;&#65039;&#160;P2&#160;Anomalous&#160;dependency&#160;on&#160;MetaDataClient</text><line stroke="#F9A825" stroke-width="1" x1="2816" x2="3220.5745" y1="1842.308" y2="1842.308"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="2821" y="1861.2739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="2905.1397" y="1861.2739">&#160;</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.4172" x="2908.7797" y="1861.2739">ExecutableExplainStatement</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="34.7059" x="3113.8369" y="1861.2739">has a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="236.1231" x="2821" y="1880.3419">structurally unusual dependency on</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110.3616" x="3060.763" y="1880.3419">MetaDataClient</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="307.9709" x="2821" y="1899.4098">(score 0.25). This creates a cross-layer coupling</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="317.1548" x="2821" y="1918.4777">where a statement execution inner class directly</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="323.7768" x="2821" y="1937.5456">depends on a schema metadata client, bypassing</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="291.7869" x="2821" y="1956.6135">the typical query plan abstraction. While this</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="286.8869" x="2821" y="1975.6814">dependency is pre-existing, the PR modifies</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.4172" x="2821" y="1994.7494">ExecutableExplainStatement</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="187.5433" x="3026.0572" y="1994.7494">and adds a new dependency</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="13.524" x="2821" y="2013.8173">to</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="145.2775" x="2838.1639" y="2013.8173">ExplainJsonRenderer</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="166.9354" x="2983.4414" y="2013.8173">, making this a good time</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="158.8994" x="2821" y="2032.8852">to address the coupling.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="2821" y="2051.9531">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="70.8957" x="2870.8958" y="2051.9531">Extract the</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="110.3616" x="2821" y="2071.021">MetaDataClient</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="75.5157" x="2935.0016" y="2071.021">usage from</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.4172" x="3014.1573" y="2071.021">ExecutableExplainStatement</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="130.3955" x="2821" y="2090.0889">into a new interface</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178.3873" x="2955.0355" y="2090.0889">ExplainMetadataProvider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="12.2639" x="3137.0628" y="2090.0889">in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="342.6067" x="2821" y="2109.1569">the org.apache.phoenix.compile package, and inject</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="38.0939" x="2821" y="2128.2248">it into</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.4172" x="2862.7338" y="2128.2248">ExecutableExplainStatement</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="77.6297" x="3067.791" y="2128.2248">to decouple</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="308.8248" x="2821" y="2147.2927">the explain logic from the metadata client. This</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="317.0988" x="2821" y="2166.3606">would reduce the anomalous coupling and align</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="193.0592" x="2821" y="2185.4285">with the layered architecture.</text></g><!--link org-apache-phoenix-util-TestUtil to org-apache-phoenix-jdbc-PhoenixStatement--><g class="link" data-entity-1="ent0018" data-entity-2="ent0008" data-link-type="dependency" data-source-line="243" id="lnk19"><path codeLine="243" d="M1921.31,2038.522 C1928.97,2129.442 1949.8761,2377.6632 1961.4161,2514.5732" fill="none" id="org-apache-phoenix-util-TestUtil-to-org-apache-phoenix-jdbc-PhoenixStatement" stroke="#464646" stroke-width="1"/><polygon fill="#464646" points="1961.92,2520.552,1965.1499,2511.2478,1961.5,2515.5696,1957.1782,2511.9197,1961.92,2520.552" stroke="#464646" stroke-width="1"/></g><!--link org-apache-phoenix-compile-ExplainJsonRenderer to org-apache-phoenix-compile-ExplainPlanAttributes--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="244" id="lnk20"><path codeLine="244" d="M1974.25,3462.912 C1970.93,3483.832 1968.6201,3498.3661 1965.7201,3516.6461" fill="none" id="org-apache-phoenix-compile-ExplainJsonRenderer-to-org-apache-phoenix-compile-ExplainPlanAttributes" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1964.78,3522.572,1970.1408,3514.3099,1965.5634,3517.6337,1962.2396,3513.0564,1964.78,3522.572" stroke="#00CC00" stroke-width="1"/></g><!--link org-apache-phoenix-query-explain-ExplainPlanTestUtil to org-apache-phoenix-compile-ExplainPlanAttributes--><g class="link" data-entity-1="ent0013" data-entity-2="ent0005" data-link-type="dependency" data-source-line="245" id="lnk21"><path codeLine="245" d="M1122.89,764.452 C1300.66,808.902 1518.86,896.712 1630.5,1068.602 C1655.86,1107.642 1637.96,1441.652 1630.5,1487.602 C1626,1515.352 1615.9,1520.012 1610.5,1547.602 C1495.4,2136.142 1523.5,2294.412 1523.5,2894.102 C1523.5,2894.102 1523.5,2894.102 1523.5,3070.602 C1523.5,3251.672 1513.95,3327.492 1634.5,3462.602 C1655.92,3486.612 1677.2008,3503.3523 1705.6808,3519.5023" fill="none" id="org-apache-phoenix-query-explain-ExplainPlanTestUtil-to-org-apache-phoenix-compile-ExplainPlanAttribut