ength="86.9677" x="1714" y="3181.5679">Serializes an</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153.5094" x="1804.6077" y="3181.5679">ExplainPlanAttributes</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.0971" x="1961.7571" y="3181.5679">tree to a JSON document for the</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="60.3678" x="2189.4942" y="3181.5679">EXPLAIN</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="554.594" x="1714" y="3200.6358">[FORMAT JSON] &lt;/back&gt; statement. The output is pretty-printed with two space</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="537.7799" x="1714" y="3219.7038">indentation for both objects and arrays. The JSON layout tracks the Java field</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="163.8414" x="1714" y="3238.7717">names and structure of</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153.5094" x="1881.4814" y="3238.7717">ExplainPlanAttributes</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="208.0812" x="2034.9908" y="3238.7717">. It is deliberately not a stable</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="506.3921" x="1714" y="3257.8396">contract and carries no version field. It is an opt-in view onto an internal</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="531.7742" x="1714" y="3276.9075">structure, useful for tooling and assertions. This class intentionally does not</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="117.9916" x="1714" y="3295.9754">reuse the shared</text><text fill="#000000" filter="url(#b1qan2iibrvbc90)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="249.6471" x="1835.6315" y="3295.9754">org.apache.phoenix.util.JacksonUtil</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="134.4555" x="2088.9186" y="3295.9754">mapper so that the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="573.4659" x="1714" y="3315.0433">general-purpose mapper configuration can change without affecting the EXPLAIN</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="101.7236" x="1714" y="3334.1113">JSON contract.</text><line stroke="#24292E" stroke-width="1" x1="1709" x2="2292.4659" y1="3342.2132" y2="3342.2132"/><g transform="translate(1714,3346.2132)"><linearGradient id="i_0_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_0_r"><rect width="64" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="