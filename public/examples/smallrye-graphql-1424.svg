="Consolas,Menlo,Liberation Mono" font-size="14" textLength="174.74">removed public methods</text><text x="365.01" y="1471.128" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="103.947">isNotEmpty()</text><text x="13" y="1487.425" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="26.339">and</text><text x="43.789" y="1487.425" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="178.302">setNotEmpty(boolean)</text><text x="222.091" y="1487.425" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="226.755">. 12 components depend on this</text><text x="13" y="1503.722" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="400.941">type, and the removal may cause compilation or runtime</text><text x="13" y="1520.019" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="375.772">failures in those dependents. This is a stable contract</text><text x="13" y="1536.315" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="398.535">change that should be coordinated across the codebase.</text><text x="13" y="1552.612" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="28.991">Fix:</text><text x="46.441" y="1552.612" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="214.102">Restore the removed methods</text><text x="264.993" y="1552.612" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="103.947">isNotEmpty()</text><text x="373.391" y="1552.612" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="26.339">and</text><text x="13" y="1568.909" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="178.302">setNotEmpty(boolean)</text><text x="195.752" y="1568.909" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="12.763">in</text><text x="212.965" y="1568.909" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="68.236">Wrapper</text><text x="285.651" y="1568.909" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="101.924">and deprecate</text><text x="13" y="1585.206" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="350.56">them instead, or update all 12 known dependents</text><text x="13" y="1601.503" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="36.313">(e.g.,</text><text x="53.763" y="1601.503" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="119.656">AbstractHelper</text><text x="173.419" y="1601.503" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45">,</text><text x="182.319" y="1601.503" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="154.93">DefaultMapAdapter</text><text x="337.249" y="1601.503" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45">,</text><text x="13" y="1617.8" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="157.274">DataFetcherFactory</text><text x="170.274" y="1617.8" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45">,</text><text x="179.175" y="1617.8" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="77.998">Bootstrap</text><text x="257.173" y="1617.8" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="114.01">) to use the new</text><text x="13" y="1634.097" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="88.512">isNonNull()</text><text x="101.512" y="1634.097" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.717">/</text><text x="106.228" y="1634.097" filter="url(#B)" font-family="monospace" font-size="14" font-weight="bold" textLength="162.866">setNonNull(boolean)