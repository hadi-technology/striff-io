data-qualified-name="surfaced_note_1" data-source-line="197" id="ent0017"><rect fill="#FFFBEB" height="169.1814" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="354.8307" x="7" y="905.5"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="354.8307" x="7" y="905.5"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="354.8307" x="7" y="927.206"/><rect fill="none" height="169.1814" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="354.8307" x="7" y="905.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="199.8295" x="84.5006" y="924.397">&#9888;&#65039;&#160;P2&#160;Session&#160;config&#160;aggregation</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="360.8307" y1="933.206" y2="933.206"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="13" y="952.172">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="157.2054" x="100.7797" y="952.172">PR adds a new interface</text><text fill="#000000" filter="url(#b5tykjp1ay7442)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="232.9871" x="13" y="971.2399">MastraAuthAuth0SessionOptions</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="106.2036" x="249.6271" y="971.2399">aggregated into</text><text fill="#000000" filter="url(#b5tykjp1ay7442)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="180.9493" x="13" y="990.3078">MastraAuthAuth0Options</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="160.5374" x="193.9493" y="990.3078">, increasing coupling (EC</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="178.6953" x="13" y="1009.3757">+3) and instability by +0.13.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="13" y="1028.4436">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="58.5758" x="62.8958" y="1028.4436">Consider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="316.3149" x="13" y="1047.5115">making session properties optional or providing</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="203.1252" x="13" y="1066.5795">defaults if not always required.</text></g><!--class surfaced_note_2--><g class="entity" data-qualified-name="surfaced_note_2" data-source-line="202" id="ent0020"><rect fill="#FFFBEB" height="169.1814" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="356.1467" x="1260.5" y="7"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="356.1467" x="1260.5" y="7"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="356.1467" x="1260.5" y="28.706"/><rect fill="none" height="169.1814" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="356.1467" x="1260.5" y="7"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="170.8784" x="1353.1341" y="25.897">&#9888;&#65039;&#160;P2&#160;New&#160;auth&#160;dependency</text><line stroke="#F9A825" stroke-width="1" x1="1261.5" x2="1615.6467" y1="34.706" y2="34.706"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="1266.5" y="53.672">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="253.777" x="1354.2797" y="53.672">PR introduces a new dependency from</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="173.6553" x="1266.5" y="72.7399">examples agent to auth0's</text><text fill="#000000" filter="url(#b5tykjp1ay7442)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92.0636" x="1443.7953" y="72.7399">StatePayload</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="74.7877" x="1535.859" y="72.7399">, which had</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="333.7167" x="1266.5" y="91.8078">no prior edge. This could indicate unintended tight</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="60.6898" x="1266.5" y="110.8757">coupling.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="1266.5" y="129.9436">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="79.3937" x="1316.3958" y="129.9436">Encapsulate</text><text fill="#000000" filter="url(#b5tykjp1ay7442)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92.0636" x="1399.4295" y="129.9436">StatePayload</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="23.7579" x="1495.1331" y="129.9436">in a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="331.2388" x="1266.5" y="149.0115">shared types package or ensure the agent module</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="238.9091" x="1266.5" y="168.0795">only depends on abstract interfaces.</text></g><!--reverse link auth-auth0-src-index-MastraAuthAuth0Options to auth-auth0-src-index-MastraAuthAuth0SessionOptions--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="aggregation" data-source-line="178" id="lnk12"><path codeLine="178" d="M580.0023,1610.0568 C575.0723,1667.9768 570,1727.66 565.55,1779.89" fill="none" id="auth-auth0-src-index-MastraAuthAuth0Options-backto-auth-auth0-src-index-MastraAuthAuth0SessionOptions" stroke="#00CC00" stroke-width="1"/><polygon fill="none" points="581.02,1598.1,576.5255,1603.7391,580.0023,1610.0568,584.4967,1604.4176,581.02,1598.1" stroke="#00CC00" stroke-width="1"/></g><!--link examples-agent-src-mastra-auth-module-index to examples-agent-src-mastra-auth-types-AuthResult--><g class="link" data-entity-1="ent0010" data-entity-2="ent0009" data-link-type="dependency" data-source-line="179" id="lnk13"><path codeLine="179" d="M1816.63,583.29 C1848.59,672.18 1884.8494,773.044 1914.1894,854.624" fill="none" id="examples-agent-src-mastra-auth-module-index-to-examples-agent-src-mastra-auth-types-AuthResult" stroke="#464646" stroke-width="1"/><polygon fill="#464646" points="1916.22,860.27,1916.9381,850.4474,1914.5279,855.565,1909.4102,853.1548,1916.22,860.27" stroke="#464646" stroke-width="1"/></g><!--link examples-agent-src-mastra-auth-module-index to auth-auth0-src-index-StatePayload--><g class="link" data-entity-1="ent0010" data-entity-2="ent0007" data-link-type="dependency" data-source-line="180" id="lnk14"><path codeLine="180" d="M1496.8,467.6 C1312.86,506.19 1059.11,555.02 833.5,583 C808.42,586.11 626.23,581.21 606.5,597 C506.74,676.8 490.9812,832.5601 490.3712,921.3101" fill="none" id="examples-agent-src-mastra-auth-module-index-to-auth-auth0-src-index-StatePayload" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="490.3