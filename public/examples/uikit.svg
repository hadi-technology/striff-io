" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="1811.5" y="49.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="279.6377" x="1911.6328" y="49.1279">introduces a legacy module importing a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="394.085" x="1811.5" y="65.4248">ui-react chart component that is documented as not yet</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="72.543" x="1811.5" y="81.7217">shipped in</text><text fill="#000000" filter="url(#bg4bomagghd3h1)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="365.0938" x="1888.4932" y="81.7217">apps/docs/content/docs/guides/migration.mdx</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="2253.5869" y="81.7217">,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="198.9189" x="1811.5" y="98.0186">violating the migration plan.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="1811.5" y="114.3154">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="84.8682" x="1868.8945" y="114.3154">Remove the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="332.418" x="1811.5" y="130.6123">import from ui-legacy to ui-react chart until the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="362.4277" x="1811.5" y="146.9092">chart component is officially released. 