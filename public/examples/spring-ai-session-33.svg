,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="28.752">(...)</text><path stroke="#24292e" d="M43 73h615.732"/><text x="48" y="89.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="160.72">Integration tests for</text><text x="213.594" y="89.995" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="183.928">SessionMemoryAdvisor</text><text x="402.396" y="89.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="249.977">exercised end-to-end through a</text><text x="48" y="106.292" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="605.732">Spring Boot application context. No external LLM is required — the advisor&apos;s</text><text x="48" y="122.589" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="64.422">before[]</text><text x="117.296" y="122.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="29.436">and</text><text x="151.606" y="122.589" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="51.427">after[]</text><text x="207.906" y="122.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="413.841">hooks are invoked directly to verify that the session</text><text x="48" y="138.886" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="557.143">is populated correctly and that conversation history is re-injected into</text><text x="48" y="155.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="371.923">subsequent prompts. @author Christian Tzolov</text><path stroke="#24292e" d="M43 162.484h615.732"/><path fill="#24292e" d="M48 166.484h44.1v18H48z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="255" y="150" fill="#010101" fill-opacity=".3" textLength="390" transform="matrix(.09 0 0 .09 48 166.484)">NOC: 0</text><text x="255" y="140" textLength="390" transform="matrix(.09 0 0 .09 48 166.484)">NOC: 0</text></g><text x="108" y="183.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M112.45 166.484h38.7v18h-38.7z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="225" y="150" fill="#010101" fill-opacity=".3" textLength="330" transform="matrix(.09 0 0 .09 112.45 166.484)">DIT: 1</text><text x="225" y="140" textLength="330" transform="matrix(.09 0 0 .09 112.45 166.484)">DIT: 1</text></g><text x="166.45" y="183.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M170.9 166.484h47.7v18h-47.7z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="275" y="150" fill="#010101" fill-opacity=".3" textLength="430" transform="matrix(.09 0 0 .09 170.9 166.484)">WMC: 0</text><text x="275" y="140" textLength="430" transform="matrix(.09 0 0 .09 170.9 166.484)">WMC: 0</text></g><text x="234.9" y="183.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M239.35 166.484h42.3v18h-42.3z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="245" y="150" fill="#010101" fill-opacity=".3" textLength="370" transform="matrix(.09 0 0 .09 239.35 166.484)">ENC: 0</text><text x="245" y="140" textLength="370" transform="matrix(.09 0 0 .09 239.35 166.484)">ENC: 0</text></g><text x="297.351" y="183.183" font-famil