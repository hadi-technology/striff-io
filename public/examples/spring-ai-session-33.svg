<?plantuml 1.2026.0?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="703" height="760" data-diagram-type="CLASS" preserveAspectRatio="none" style="width:703px;height:760px;background:#f8f8f8" viewBox="0 0 703 760"><defs><filter id="a" width="1" height="1" x="0" y="0"><feFlood flood-color="#e6e6e6" result="flood"/><feComposite in="SourceGraphic" in2="flood"/></filter><filter id="c" width="1" height="1" x="0" y="0"><feFlood flood-color="#b3e3f5" result="flood"/><feComposite in="SourceGraphic" in2="flood"/></filter><filter id="d" width="1" height="1" x="0" y="0"><feFlood flood-color="#bef5cb" result="flood"/><feComposite in="SourceGraphic" in2="flood"/></filter></defs><path fill="#f8f8f8" d="M0 0h703v760H0z"/><g class="cluster" data-qualified-name="pkg_org_springframework_ai_session_advisor_352f2069" data-source-line="70"><path fill="#f0fffa" stroke="#a0a0a0" d="M12 6h269.536a9 9 0 0 1 6 6l7 16.297H690a6 6 0 0 1 6 6V728a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6"/><path stroke="#a0a0a0" d="M6 28.297h288.536"/><text x="10" y="20.995" fill="#24292e" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="275.536">org.springframework.ai.session.advisor</text></g><g class="entity" data-qualified-name="org.springframework.ai.session.advisor.SessionMemoryAdvisor" data-source-line="71"><rect width="657.34" height="271.563" x="22.5" y="446" fill="#f8f8f8" stroke="#24292e" rx="6" ry="6"/><rect width="657.34" height="32" x="22.5" y="446" fill="#24292e" stroke="#24292e" rx="6" ry="6"/><path fill="#24292e" stroke="#24292e" d="M22.5 472h657.34v6H22.5z"/><rect width="657.34" height="271.563" x="22.5" y="446" fill="none" stroke="#24292e" rx="6" ry="6"/><circle cx="216.241" cy="462" r="11" fill="#add1b2" stroke="#181818"/><path d="M219.21 467.64q-.579.298-1.22.438-.64.156-1.343.156-2.5 0-3.828-1.64-1.313-1.656-1.313-4.781t1.313-4.782q1.328-1.656 3.828-1.656.703 0 1.344.156.656.156 1.218.453v2.72q-.625-.579-1.218-.845-.594-.28-1.219-.28-1.344 0-2.031 1.077-.688 1.063-.688 3.156t.688 3.172q.687 1.063 2.031 1.063.625 0 1.219-.266.593-.281 1.218-.86z"/><text x="236.741" y="466.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="172.519">SessionMemoryAdvisor [</text><text x="413.709" y="466.847" fill="#bef5cb" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="20.638">+1</text><text x="434.347" y="466.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><text x="438.797" y="466.847" fill="#b3e3f5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="20.638">+2</text><text x="459.435" y="466.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="5.462">]</text><text x="469.347" y="466.847" fill="#ffdead" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="28.752">(...)</text><path stroke="#24292e" d="M23.5 478h655.34"/><text x="28.5" y="494.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="10.835">A</text><text x="44.209" y="494.995" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="97.583">BaseAdvisor</text><text x="146.666" y="494.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="355.414">that manages conversation history using the</text><text x="506.954" y="494.995" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="118.829">SessionService</text><text x="625.783" y="494.995" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="5.318">,</text><text x="28.5" y="511.292" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="623.807">with optional context compaction. On each interaction: Retrieves the session&apos;s</text><text x="28.5" y="527.589" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="645.34">event history and prepends it to the prompt messages. Appends the current user</text><text x="28.5" y="543.886" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="428.511">message to the session, if accepted by the configured</text><text x="461.885" y="543.886" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="111.31">MessageFilter</text><text x="573.194" y="543.886" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="81.238">. After the</text><text x="28.5" y="560.183" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="611.734">model responds, appends the assistant message[s] to the session; messages</text><text x="28.5" y="576.48" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="210.308">rejected by the configured</text><text x="243.682" y="576.48" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="111.31">MessageFilter</text><text x="359.865" y="576.48" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="244.214">are skipped. By default, empty</text><text x="28.5" y="592.776" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="606.566">assistant messages [blank text, no tool calls, and no media] are filtered out.</text><text x="28.5" y="609.073" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" textLength="586.366">Optionally triggers context compaction if the configured trigger fires. The</text><text x="28.5" y="625.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="200.915">**session is identified by the</text><text x="233.865" y="625.37" filter="url(#a)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="227.233">#SESSION_ID_CONTEXT_KEY&lt;...</text><path stroke="#24292e" d="M23.5 632.672h655.34"/><path fill="#24292e" d="M28.5 636.672h44.1v18H28.5z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="255" y="150" fill="#010101" fill-opacity=".3" textLength="390" transform="matrix(.09 0 0 .09 28.5 636.672)">NOC: 0</text><text x="255" y="140" textLength="390" transform="matrix(.09 0 0 .09 28.5 636.672)">NOC: 0</text></g><text x="88.5" y="653.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M92.95 636.672h38.7v18h-38.7z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="225" y="150" fill="#010101" fill-opacity=".3" textLength="330" transform="matrix(.09 0 0 .09 92.95 636.672)">DIT: 1</text><text x="225" y="140" textLength="330" transform="matrix(.09 0 0 .09 92.95 636.672)">DIT: 1</text></g><text x="146.95" y="653.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><path fill="#24292e" d="M151.4 636.672h53.1v18h-53.1z"/><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-anchor="middle" text-rendering="geometricPrecision"><text x="305" y="150" fill="#010101" fill-opacity=".3" textLength="490" transform="matrix(.09 0 0 .09 151.4 636.672)">WMC: 29</text><text x="305" y="140" textLength="490" transform="matrix(.09 0 0 .09 151.4 636.672)">WMC: 29</text></g><text x="221.4" y="653.37" font-family="Consolas,Menlo,Liberation Mono" font-size="14" textLength="4.45"> </text><g transform="translate(225.85 636.672)"><linearGradient id="b" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></lin