6308.5,439.2891" stroke="#B38D22" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="347.4434" x="6321.5" y="443.6357">doGet(HttpServletRequest, HttpServletResponse)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="6312.5" cy="456.5859" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="343.4922" x="6321.5" y="459.9326">IcebergRestCatalogServlet(RESTCatalogAdapter)</text></g><!--class surfaced_note_0--><g class="entity" data-qualified-name="surfaced_note_0" data-source-line="282" id="ent0034"><rect fill="#FEF2F2" height="130.9141" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="422.1768" x="4876" y="188.5"/><rect fill="#FECACA" height="25.1328" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="422.1768" x="4876" y="188.5"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="422.1768" x="4876" y="207.6328"/><rect fill="none" height="130.9141" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="422.1768" x="4876" y="188.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="321.2485" x="4926.4641" y="205.5669">&#127919;&#160;Structural&#160;Regression:&#160;Stable&#160;contract&#160;modified</text><line stroke="#F9A825" stroke-width="1" x1="4877" x2="5297.1768" y1="213.6328" y2="213.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="4882" y="230.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="4977.6826" y="230.6279">&#160;</text><text fill="#000000" filter="url(#bpr0uhjc335bf2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="62.7949" x="4982.1328" y="230.6279">HiveUtil</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="207.6484" x="5049.3779" y="230.6279">has afferent coupling of 35 &#8212;</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="410.1768" x="4882" y="246.9248">changes to this component impact at least 35 dependents</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="142.6113" x="4882" y="263.2217">in the parsed scope.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="4882" y="279.5186">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="167.2002" x="4939.3945" y="279.5186">Review the API contract</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="334.0176" x="4882" y="295.8154">changes for backward compatibility. Consider a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="293.084" x="4882" y="312.1123">deprecation path for removed signatures.</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="286" id="ent0036"><rect fill="#FEF2F2" height="196.1016" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="409.5645" x="5857" y="156"/><rect fill="#FECACA" height="25.1328" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="409.5645" x="5857" y="156"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="409.5645" x="5857" y="175.1328"/><rect fill="none" height="196.1016" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="409.5645" x="5857" y="156"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="342.5449" x="5890.5098" y="173.0669">&#127919;&#160;Structural&#160;Regression:&#160;Hive&#160;layout&#160;handle&#160;coupling</text><line stroke="#F9A825" stroke-width="1" x1="5858" x2="6265.5645" y1="181.1328" y2="181.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="5863" y="198.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="59.7051" x="5963.1328" y="198.1279">modifies</text><text fill="#000000" filter="url(#bpr0uhjc335bf2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="187.667" x="6027.2881" y="198.1279">HiveTableLayoutHandle</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="41.1592" x="6219.4053" y="198.1279">(WMC</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="337.7568" x="5863" y="214.4248">-4) but it already has 4 advisory outgoing edges</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="19.5166" x="5863" y="230.7217">(to</text><text fill="#000000" filter="url(#bpr0uhjc335bf2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.8242" x="5886.9668" y="230.7217">HiveBucketFilter</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="218.8799" x="6018.791" y="230.7217">, TupleDomain.ColumnDomain,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="108.4248" x="5863" y="247.0186">its own Builder,</text><text fill="#000000" filter="url(#bpr0uhjc335bf2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.166" x="5975.875" y="247.0186">MetadataUtils</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="124.0518" x="6087.041" y="247.0186">). The component</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="311.0762" x="5863" y="263.3154">is a pre-existing hotspot with high structural</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="60.5254" x="5863" y="279.6123">concern.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="5863" y="295.9092">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="241.876" x="5920.3945" y="295.9092">Consider whether the dependency</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="17.4385" x="5863" y="312.2061">on</text><text fill="#000000" filter="url(#bpr0uhjc335bf2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="251.501" x="5884.8887" y="312.2061">HiveBucketing.HiveBucketFilter</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="112.4717" x="6140.8398" y="312.2061">can be replaced</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="312.9697" x="5863" y="328.5029">with a simpler value type to reduce coupling</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="185.4043" x="5863" y="344.7998">to the bucketing internals.<