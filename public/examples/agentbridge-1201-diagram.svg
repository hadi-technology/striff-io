938 Q842.8955,948.9375 842.8955,945.8125 Q842.8955,942.6875 844.208,941.0313 Q845.5361,939.375 848.0361,939.375 Q848.7393,939.375 849.3799,939.5313 Q850.0361,939.6875 850.5986,939.9844 L850.5986,942.7031 Q849.9736,942.125 849.3799,941.8594 Q848.7861,941.5781 848.1611,941.5781 Q846.8174,941.5781 846.1299,942.6563 Q845.4424,943.7188 845.4424,945.8125 Q845.4424,947.9063 846.1299,948.9844 Q846.8174,950.0469 848.1611,950.0469 Q848.7861,950.0469 849.3799,949.7813 Q849.9736,949.5 850.5986,948.9219 L850.5986,951.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="102.7305" x="868.1299" y="950.8467">ChipStripPanel</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.752" x="975.3105" y="950.8467">(...)</text><line stroke="#24292E" stroke-width="1" x1="593" x2="1246.6924" y1="962" y2="962"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="623.9775" x="598" y="978.9951">A two-row strip holding tool/thinking chips and an optional collapsible thought</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="643.6924" x="598" y="995.292">bubble. Layout [BoxLayout.Y_AXIS]: - [chipRow]: horizontal row with the optional</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="587.7334" x="598" y="1011.5889">thinking chip pinned left, then &#8249;/&#8250; nav buttons flanking a scrollable area of</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="624.5176" x="598" y="1027.8857">tool chips. - [thinkingBubble]: optional thought bubble below [chipRow]. When</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="566.8086" x="598" y="1044.1826">hidden [[isVisible] = false], it takes zero space &#8212; no border, no margin.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="624.791" x="598" y="1060.4795">Drag-to-scroll: the [dragListener] is added to each chip as well as the viewport</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="629.9111" x="598" y="1076.7764">and inner panel, because mouse events on chip children don't propagate to the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="621.5303" x="598" y="1093.0732">parent panel. Drag coordinates are always converted to viewport space so the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="547.9209" x="598" y="1109.3701">delta is consistent regardless of which component initiated the drag.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="598" y="1125.667">&#160;</text><g transform="translate(598,1128.9688)"><linearGradient id="i_75_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_75_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="