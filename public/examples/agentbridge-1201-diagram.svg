5 1149.7241,1489.0781 Q1149.0835,1489.2344 1148.3804,1489.2344 Q1145.8804,1489.2344 1144.5522,1487.5938 Q1143.2397,1485.9375 1143.2397,1482.8125 Q1143.2397,1479.6875 1144.5522,1478.0313 Q1145.8804,1476.375 1148.3804,1476.375 Q1149.0835,1476.375 1149.7241,1476.5313 Q1150.3804,1476.6875 1150.9429,1476.9844 L1150.9429,1479.7031 Q1150.3179,1479.125 1149.7241,1478.8594 Q1149.1304,1478.5781 1148.5054,1478.5781 Q1147.1616,1478.5781 1146.4741,1479.6563 Q1145.7866,1480.7188 1145.7866,1482.8125 Q1145.7866,1484.9063 1146.4741,1485.9844 Q1147.1616,1487.0469 1148.5054,1487.0469 Q1149.1304,1487.0469 1149.7241,1486.7813 Q1150.3179,1486.5 1150.9429,1485.9219 L1150.9429,1488.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="152.1338" x="1168.4741" y="1487.8467">NativeMarkdownPane</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.752" x="1325.0581" y="1487.8467">(...)</text><line stroke="#24292E" stroke-width="1" x1="906.5" x2="1583.2842" y1="1499" y2="1499"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="620.1699" x="911.5" y="1515.9951">A [JEditorPane]-based component that renders streaming markdown as HTML.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="666.7842" x="911.5" y="1532.292">Markdown text is accumulated via [appendMarkdown] and converted to HTML using</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="544.2158" x="911.5" y="1548.5889">[MarkdownRenderer.markdownToHtml] with file-link resolution from</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="638.0596" x="911.5" y="1564.8857">[FileNavigator]. Re-rendering is throttled to at most [RENDER_INTERVAL_MS] ms</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="621.8721" x="911.5" y="1581.1826">[~30 fps] during streaming. Each chunk either renders immediately [if enough</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="585.2588" x="911.5" y="1597.4795">time has elapsed] or schedules a render at the end of the current interval</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="601.4531" x="911.5" y="1613.7764">window, so bursts of rapid tokens never suppress visible updates the way a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="630.1709" x="911.5" y="1630.0732">debounce would. Height is computed accurately after each render via the same</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="567.2734" x="911.5" y="1646.3701">HTML layout engine that handles window-resize reflows for all bubbles.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="656.1543" x="911.5" y="1662.667">[onHeightGrew] fires through [setBounds] whenever the layout manager assigns a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="343.9775" x="911.5" y="1678.9639">taller height &#8212; accurate, zero-latency, no...</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="911.5" y="1695.2607">&#160;</text><g transform="translate(911.5,1698.5625)"><linearGradient id="i_48_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_48_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">NOC: 0</text><text x="255" y="140" transform="scale(.1)" textLength="390">NOC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="971.5" y="1715.2607">&#160;</text><g transform="translate(975.9502,1698.5625)"><linearGradient id="i_49_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_49_r"><rect width="54" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="43" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="225" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330">DIT: 1</text><text x="225" y="140" transform="scale(.1)" textLength="330">DIT: 1</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1029.9502" y="1715.2607">&#160;</text><g transform="translate(1034.4004,1698.5625)"><linearGradient id="i_50_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_50_r"><rect width="78" h