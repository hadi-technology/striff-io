010"><rect fill="#F8F8F8" height="312.1563" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="638.8623" x="666.5" y="546"/><rect fill="#24292E" height="32" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="638.8623" x="666.5" y="546"/><rect fill="#24292E" height="2.5" stroke="#24292E" stroke-width="1" width="638.8623" x="666.5" y="575.5"/><rect fill="none" height="312.1563" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="638.8623" x="666.5" y="546"/><ellipse cx="874.0835" cy="562" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1"/><path d="M877.0522,567.6406 Q876.4741,567.9375 875.8335,568.0781 Q875.1929,568.2344 874.4897,568.2344 Q871.9897,568.2344 870.6616,566.5938 Q869.3491,564.9375 869.3491,561.8125 Q869.3491,558.6875 870.6616,557.0313 Q871.9897,555.375 874.4897,555.375 Q875.1929,555.375 875.8335,555.5313 Q876.4897,555.6875 877.0522,555.9844 L877.0522,558.7031 Q876.4272,558.125 875.8335,557.8594 Q875.2397,557.5781 874.6147,557.5781 Q873.271,557.5781 872.5835,558.6563 Q871.896,559.7188 871.896,561.8125 Q871.896,563.9063 872.5835,564.9844 Q873.271,566.0469 874.6147,566.0469 Q875.2397,566.0469 875.8335,565.7813 Q876.4272,565.5 877.0522,564.9219 L877.0522,567.6406 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="126.3555" x="894.5835" y="566.8467">NativeChatPanel [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="1025.3892" y="566.8467">+4</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1046.0269" y="566.8467">&#160;</text><text fill="#B3E3F5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="20.6377" x="1050.4771" y="566.8467">+1</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="5.4619" x="1071.1147" y="566.8467">]</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.752" x="1081.0269" y="566.8467">(...)</text><line stroke="#24292E" stroke-width="1" x1="667.5" x2="1304.3623" y1="578" y2="578"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="618.3926" x="672.5" y="594.9951">Native Swing implementation of [ChatPanelApi] with styled chat bubbles, tool</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="607.2773" x="672.5" y="611.292">chips with animated ring indicators, and collapsible thinking sections. Agent</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="588.7656" x="672.5" y="627.5889">text bubbles use [NativeMarkdownPane] to render markdown as HTML via</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="596.4355" x="672.5" y="643.8857">[MarkdownRenderer], supporting tables, code blocks, headings, lists, bold,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="580.0566" x="672.5" y="660.1826">inline code, blockquotes, and clickable file/git links. Visually matches the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="570.3633" x="672.5" y="676.4795">JCEF panel layout: user bubbles are right-aligned with a blue tint, agent</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="626.8623" x="672.5" y="692.7764">bubbles are left-aligned with a green tint, tool calls appear as compact colored</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="570.8555" x="672.5" y="709.0732">chips in a horizontal strip, and thinking text is displayed in a collapsible</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="87.7393" x="672.5" y="725.3701">gray block.</text><line stroke="#24292E" stroke-width="1" x1="667.5" x2="1304.3623" y1="732.6719" y2="732.6719"/><g transform="translate(672.5,736.6719)"><linearGradient id="i_30_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_30_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">NOC: 0</text><text x="255" y="140" transform="scale(.1)" textLength="390">NOC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="732.5" y="753.3701">&#160;</text><g transform="translate(736.9502,736.6719)"><linearGradient id="i_31_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_31_r"><rect width="54" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="43" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text 