xt fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="276.8486" x="234.0249" y="104.8467">NativeChatThinkingDisplayToggleTest [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="29.5449" x="515.3237" y="104.8467">+14</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="5.4619" x="544.8687" y="104.8467">]</text><line stroke="#24292E" stroke-width="1" x1="47" x2="704.8555" y1="116" y2="116"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="523.7217" x="52" y="132.9951">The user can turn the thinking [reasoning] bubble display off. The</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="638.7295" x="52" y="149.292">Thinking&#8230;/Thought chips ALWAYS stay in the chat so the user keeps seeing that</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="604.2627" x="52" y="165.5889">[and what] the agent thought; the toggle only controls whether the thought</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="647.8555" x="52" y="181.8857">bubble auto-expands while streaming, and collapses live-expanded bubbles when</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="608.5557" x="52" y="198.1826">turned off mid-stream. Thinking chunks are still recorded by the entry store,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="430.0283" x="52" y="214.4795">and the chip remains clickable to peek at the full text.</text><line stroke="#24292E" stroke-width="1" x1="47" x2="704.8555" y1="221.7813" y2="221.7813"/><g transform="translate(52,225.7813)"><linearGradient id="i_81_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_81_r"><rect width="60" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="49" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="390">NOC: 0</text><text x="255" y="140" transform="scale(.1)" textLength="390">NOC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="112" y="242.4795">&#160;</text><g transform="translate(116.4502,225.7813)"><linearGradient id="i_82_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_82_r"><rect width="54" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="43" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="225" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330">DIT: 2</text><text x="225" y="140" transform="scale(.1)" textLength="330">DIT: 2</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="170.4502" y="242.4795">&#160;</text><g transform="translate(174.9004,225.7813)"><linearGradient id="i_83_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" s