Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="529.058" x="526.5" y="684.0867">loadSignedPolicyData(String) : CompletableFuture&lt;Etagged&lt;AthenzAssertions&gt;&gt;</text><g data-visibility-modifier="PACKAGE_PRIVATE_METHOD"><polygon fill="#A0A0A0" points="517.5,695.2226,513.5,701.2226,521.5,701.2226" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" filter="url(#b9yoeurhe0jw81)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="185.4153" x="526.5" y="703.1546">getNow() : AthenzAssertions</text><g data-visibility-modifier="PRIVATE_METHOD"><rect fill="#F24D5C" height="6" stroke="#C82930" stroke-width="1" width="6" x="514.5" y="715.2905"/></g><text fill="#000000" filter="url(#b9yoeurhe0jw82)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="629.3396" x="526.5" y="722.2225">loadPolicyData(Etagged&lt;AthenzAssertions&gt;) : CompletableFuture&lt;Etagged&lt;AthenzAssertions&gt;&gt;</text></g><!--class surfaced_note_0--><g class="entity" data-qualified-name="surfaced_note_0" data-source-line="221" id="ent0026"><rect fill="#FEF2F2" height="188.2494" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="405.7065" x="7" y="63.102"/><rect fill="#FECACA" height="27.706" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="405.7065" x="7" y="63.102"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="405.7065" x="7" y="84.808"/><rect fill="none" height="188.2494" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="405.7065" x="7" y="63.102"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="137.1371" x="141.2847" y="81.999">&#127919;&#160;P1&#160;New&#160;package&#160;cycle</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="411.7065" y1="90.808" y2="90.808"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="13" y="109.7739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="209.5651" x="100.7797" y="109.7739">Package-level dependency cycle</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="317.7428" x="13" y="128.8419">detected involving components this PR changes:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="250.529" x="13" y="147.9098">com.linecorp.armeria.server.athenz -&gt;</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="393.7065" x="13" y="166.9777">com.linecorp.armeria.server.athenz.AthenzPolicyLoader</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="250.529" x="13" y="186.0456">-&gt; com.linecorp.armeria.server.athenz</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="13" y="205.1135">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="38.1078" x="62.8958" y="205.1135">Break</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="340.6327" x="13" y="224.1814">the cycle by extracting a shared interface or moving</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="245.5171" x="13" y="243.2494">common logic to a separate package.</text></g><!--class surfaced_note_2--><g class="entity" data-qualified-name="surfaced_note_2" data-source-line="225" id="ent0028"><rect fill="#FFFBEB" height="188.2494" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="406.2805" x="2891" y="790.102"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="406.2805" x="2891" y="790.102"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="406.2805" x="2891" y="811.808"/><rect fill="none" height="188.2494" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="406.2805" x="2891" y="790.102"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="237.5815" x="2975.3495" y="808.999">&#9888;&#65039;&#160;P2&#160;Cross-package&#160;client&#160;dependency</text><line stroke="#F9A825" stroke-width="1" x1="2892" x2="3296.2805" y1="817.808" y2="817.808"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="2897" y="836.7739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="103.0116" x="2984.7797" y="836.7739">New inner class</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.2295" x="3091.4312" y="836.7739">AsAthenzAssertions</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="56.9798" x="3234.3007" y="836.7739">depends</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="124.2635" x="2897" y="855.8419">on client exception</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.0952" x="3024.9035" y="855.8419">InvalidHttpResponseException</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.752" x="3239.9987" y="855.8419">,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="363.9147" x="2897" y="874.9098">crossing the server-client boundary and coupling policy</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="261.785" x="2897" y="893.9777">loading to a client-specific failure mode.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="2897" y="913.0456">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="322.6708" x="2897" y="932.1135">Abstract error handling via a shared exception or</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="332.4707" x="2897" y="951.1814">use a generic failure representation to keep server</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="272.5929" x="2897" y="970.2494">domain independent of client exceptions.</text></g><!--class surfaced_note_3--><g class="entity" data-qualified-name="surfaced_note_3" data-source-line="230" id="ent0031"><rect fill="#FFFBEB" height="207.3173" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="387.4226" x="2772.5" y="1064.102"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="387.4226" x="2772.5" y="1064.102"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="387.4226" x="2772.5" y="1085.808"/><rect fill="none" height="207.3173" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="387.4226" x="2772.5" y="1064.102"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9865" x="2852.7181" y="1082.999">&#9888;&#65039;&#160;P2&#160;Anomalous&#160;exception&#160;hierarchy</text><line stroke="#F9A825" stroke-width="1" x1="2773.5" x2="3158.9226" y1="1091.808" y2="1091.808"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="2778.5" y="1110.7739">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="144.4514" x="2866.2797" y="1110.7739">The dependency from</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.0952" x="2778.5" y="1129.8419">InvalidHttpResponseException</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="13.524" x="2997.2352" y="1129.8419">to</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="183.3713" x="2778.5" y="1148.9098">InvalidResponseException</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="188.4113" x="2965.5113" y="1148.9098">is structurally unusual (score</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="309.0068" x="2778.5" y="1167.9777">0.30) and this PR increases its fanIn, potentially</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="247.9111" x="2778.5" y="1187.0456">propagating coupling to more callers.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="2778.5" y="1206.1135">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="37.6458" x="2828.3958" y="1206.1135">Verify</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="26.6139" x="2778.5" y="1225.1814">that</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.0952" x="2808.7539" y="1225.1814">InvalidHttpResponseException</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="106.7216" x="3027.4891" y="1225.1814">should remain a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="72.4917" x="2778.5" y="1244.2494">subclass of</text><text fill="#000000" filter="url(#b9yoeurhe0jw80)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="183.3713" x="2854.6317" y="1244.2494">InvalidResponseException</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="85.2037" x="3041.643" y="1244.2494">and consider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="325.4428" x="2778.5" y="1263.3173">whether a different abstraction reduces coupling.</text></g><!--link com-linecorp-armeria-server-athenz-AthenzPolicyHandler to com-linecorp-armeria-server-athenz-AthenzAssertions--><g class="link" data-entity-1="ent0009" data-entity-2="ent0008" data-link-type="dependency" data-source-line="195" id="lnk14"><path codeLine="195" d="M742.44,1643.502 C740.15,1663.192 738.4935,1677.4422 736.2035,1697.1222" fill="none" id="com-linecorp-armeria-server-athenz-AthenzPolicyHandler-to-com-linecorp-armeria-server-athenz-AthenzAssertions" stroke="#464646" stroke-width="1"/><polygon fill="#464646" points="735.51,1703.082,740.5234,1694.6046,736.0879,1698.1155,732.577,1693.68,735.51,1703.082" stroke="#464646" stroke-width="1"/></g><!--link com-linecorp-ar