02"/><rect fill="#24292E" height="32" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="735.0974" x="9843.85" y="2379.602"/><rect fill="#24292E" height="2.5" stroke="#24292E" stroke-width="1" width="735.0974" x="9843.85" y="2409.102"/><rect fill="none" height="522.5621" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="735.0974" x="9843.85" y="2379.602"/><ellipse cx="10128.875" cy="2395.602" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1"/><path d="M10131.8438,2401.2426 Q10131.2656,2401.5395 10130.625,2401.6801 Q10129.9844,2401.8364 10129.2813,2401.8364 Q10126.7813,2401.8364 10125.4531,2400.1957 Q10124.1406,2398.5395 10124.1406,2395.4145 Q10124.1406,2392.2895 10125.4531,2390.6332 Q10126.7813,2388.977 10129.2813,2388.977 Q10129.9844,2388.977 10130.625,2389.1332 Q10131.2813,2389.2895 10131.8438,2389.5864 L10131.8438,2392.3051 Q10131.2188,2391.727 10130.625,2391.4614 Q10130.0313,2391.1801 10129.4063,2391.1801 Q10128.0625,2391.1801 10127.375,2392.2582 Q10126.6875,2393.3207 10126.6875,2395.4145 Q10126.6875,2397.5082 10127.375,2398.5864 Q10128.0625,2399.6489 10129.4063,2399.6489 Q10130.0313,2399.6489 10130.625,2399.3832 Q10131.2188,2399.102 10131.8438,2398.5239 L10131.8438,2401.2426 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="124.2775" x="10149.375" y="2401.034">SchemaRefresher [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="24.0239" x="10277.2925" y="2401.034">+15</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.606" x="10301.3164" y="2401.034">]</text><line stroke="#24292E" stroke-width="1" x1="9844.85" x2="10577.9474" y1="2411.602" y2="2411.602"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="382.8285" x="9849.85" y="2430.5679">Decouples schema-change handling from the per-node</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="527.2241" x="9849.85" y="2449.6358">com.ericsson.bss.cassandra.ecchronos.core.impl.multithreads.NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.5236" x="10380.714" y="2449.6358">threads and the</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="114.7996" x="9849.85" y="2468.7038">RepairScheduler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349.9286" x="9964.6496" y="2468.7038">. There are two tracks: Per-node track &#8212; driven by</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="89.0537" x="10318.2182" y="2468.7038">NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="115.7236" x="10410.9119" y="2468.7038">threads [one per</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="713.6055" x="9849.85" y="2487.7717">managed node]. It handles only non-incremental repair configurations, which are inherently per-node</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="688.0136" x="9849.85" y="2506.8396">[vnode / parallel vnode]. Global incremental track &#8212; driven directly by the schema-change listener</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="723.0974" x="9849.85" y="2525.9075">without going through the per-node worker threads. It handles only incremental repair configurations,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="668.5817" x="9849.85" y="2544.9754">of which there is a single logical job per table. It resolves the configuration once and hands it to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="285.7108" x="9849.85" y="2564.0433">**the scheduler on any managed node; the</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="132.4395" x="10139.2008" y="2564.0433">RepairScheduler&lt;/...</text><line stroke="#24292E" stroke-width="1" x1="9844.85" x2="10577.9474" y1="2572.1453" y2="2572.1453"/><g transform="translate(9849.85,2576.1453)"><linearGradient id="i_60_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_60_r"><rect width="64" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">NOC: 0</text><text x="245" y="140" transform="scale(.1)" textLength="370">NOC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="9913.85" y="2592.0433">&#160;</text><g transform="translate(9917.49,2576.1453)"><linearGradient id="i_61_s" x2