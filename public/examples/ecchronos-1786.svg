ont-size="14" lengthAdjust="spacing" textLength="291.3669" x="9863.85" y="2798.7225">removeConfiguration(Node, TableMetadata)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="9854.85" cy="2813.8584" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b14wg8kjur30om2)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="331.8827" x="9863.85" y="2817.7904">onKeyspaceCreated(Node, KeyspaceCreatedEvent)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="9854.85" cy="2832.9264" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b14wg8kjur30om2)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="156.8414" x="9863.85" y="2836.8583">close(Node, CloseEvent)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="9854.85" cy="2851.9943" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b14wg8kjur30om2)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="397.2065" x="9863.85" y="2855.9263">updateConfiguration(Node, TableReference, TableMetadata)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="9854.85" cy="2871.0622" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b14wg8kjur30om2)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="137.3535" x="9863.85" y="2874.9942">allTableOperation(...)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="9854.85" cy="2890.1301" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" filter="url(#b14wg8kjur30om2)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="265.173" x="9863.85" y="2894.0621">removeAllConfigurationsForNode(UUID)</text></g><!--class com-ericsson-bss-cassandra-ecchronos-core-impl-repair-incremental-IncrementalRepairJob--><g class="entity" data-qualified-name="com.ericsson.bss.cassandra.ecchronos.core.impl.repair.incremental.IncrementalRepairJob" data-source-line="294" id="ent0020"><rect fill="#F8F8F8" height="446.2904" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="567.7981" x="8107.35" y="1356.602"/><rect fill="#24292E" height="32" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="567.7981" x="8107.35" y="1356.602"/><rect fill="#24292E" height="2.5" stroke="#24292E" stroke-width="1" width="567.7981" x="8107.35" y="1386.102"/><rect fill="none" height="446.2904" rx="2.5" ry="2.5" stroke="#24292E" stroke-width="1" width="567.7981" x="8107.35" y="1356.602"/><ellipse cx="8276.7075" cy="1372.602" fill="#ADD1B2" rx="11" ry="11" stroke="#181818" stroke-width="1"/><path d="M8279.6762,1378.2426 Q8279.0981,1378.5395 8278.4575,1378.6801 Q8277.8168,1378.8364 8277.1137,1378.8364 Q8274.6137,1378.8364 8273.2856,1377.1957 Q8271.9731,1375.5395 8271.9731,1372.4145 Q8271.9731,1369.2895 8273.2856,1367.6332 Q8274.6137,1365.977 8277.1137,1365.977 Q8277.8168,1365.977 8278.4575,1366.1332 Q8279.1137,1366.2895 8279.6762,1366.5864 L8279.6762,1369.3051 Q8279.0512,1368.727 8278.4575,1368.4614 Q8277.8637,1368.1801 8277.2387,1368.1801 Q8275.895,1368.1801 8275.2075,1369.2582 Q8274.52,1370.3207 8274.52,1372.4145 Q8274.52,1374.5082 8275.2075,1375.5864 Q8275.895,1376.6489 8277.2387,1376.6489 Q8277.8637,1376.6489 8278.4575,1376.3832 Q8279.0512,1376.102 8279.6762,1375.5239 L8279.6762,1378.2426 Z " fill="#000000"/><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="151.5634" x="8297.2075" y="1378.034">IncrementalRepairJob [</text><text fill="#BEF5CB" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.0159" x="8452.4109" y="1378.034">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="8468.4268" y="1378.034">&#160;</text><text fill="#B3E3F5" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.0159" x="8472.0668" y="1378.034">+6</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.606" x="8488.0827" y="1378.034">]</text><text fill="#FFDEAD" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="21.4619" x="8496.3287" y="1378.034">(...)</text><line stroke="#24292E" stroke-width="1" x1="8108.35" x2="8674.1481" y1="1388.602" y2="1388.602"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="555.7981" x="8113.35" y="1407.5679">A scheduled job that keeps a single table repaired using Cassandra incremental</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="541.5178" x="8113.35" y="1426.6358">repairs. One job is created per managed node per table [same as vnode]. Each</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71.2177" x="8113.35" y="1445.7038">job: Reads</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173.5154" x="8188.2077" y="1445.7038">ecchronos.repair_history</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="283.9749" x="8365.3631" y="1445.7038">keyed by this node's ID to determine the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="340.4507" x="8113.35" y="1464.7717">last successful run, falling back to the Cassandra</text><text fill="#000000" filter="url(#b14wg8kjur30om3)" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6256" x="8457.4407" y="1464.7717">maxRepairedAt</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="88.2137" x="8569.7062" y="1464.7717">metric when</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="549.8761" x="8113.35" y="1483.8396">no history exists. On completion, writes one history row per replica involved in</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="537.6121" x="8113.35" y="1502.9075">the repair so that all nodes can observe the result and avoid redundant work</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175.7553" x="8113.35" y="1521.9754">within the same interval.</text><line stroke="#24292E" stroke-width="1" x1="8108.35" x2="8674.1481" y1="1530.0774" y2="1530.0774"/><g transform="translate(8113.35,1534.0774)"><linearGradient id="i_66_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_66_r"><rect width="64" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">NOC: 0</text><text x="245" y="140" transform="scale(.1)" tex