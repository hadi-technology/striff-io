ll="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="275" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="430">ENC: 0.4</text><text x="275" y="140" transform="scale(.1)" textLength="430">ENC: 0.4</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="10122.77" y="2592.0433">&#160;</text><g transform="translate(10126.4099,2576.1453)"><linearGradient id="i_64_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_64_r"><rect width="54" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="37" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="195" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="270">AC: 4</text><text x="195" y="140" transform="scale(.1)" textLength="270">AC: 4</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="3.64" x="10180.4099" y="2592.0433">&#160;</text><g transform="translate(10184.0499,2576.1453)"><linearGradient id="i_65_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_65_r"><rect width="58" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="41" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="215" y="150" fill="#010101" fill-opacity=".3" transform="scale(.