8" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="505.0967" x="22067.9" y="1307.5"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="505.0967" x="22067.9" y="1326.6328"/><rect fill="none" height="244.9922" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="505.0967" x="22067.9" y="1307.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="435.208" x="22102.8443" y="1324.5669">&#127919;&#160;Structural&#160;Regression:&#160;Bidirectional&#160;package&#160;coupling&#160;introduced</text><line stroke="#F9A825" stroke-width="1" x1="22068.9" x2="22571.9967" y1="1332.6328" y2="1332.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="22073.9" y="1349.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="121.2148" x="22174.0328" y="1349.6279">New dependency</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="493.0967" x="22073.9" y="1365.9248">com.ericsson.bss.cassandra.ecchronos.core.impl.multithreads</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.7822" x="22073.9" y="1382.2217">-&gt;</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="438.9629" x="22073.9" y="1398.5186">com.ericsson.bss.cassandra.ecchronos.core.impl.repair</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="135.2969" x="22073.9" y="1414.8154">inverts the existing</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="438.9629" x="22073.9" y="1431.1123">com.ericsson.bss.cassandra.ecchronos.core.impl.repair</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="16.7822" x="22073.9" y="1447.4092">-&gt;</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="493.0967" x="22073.9" y="1463.7061">com.ericsson.bss.cassandra.ecchronos.core.impl.multithreads</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="346.541" x="22073.9" y="1480.0029">edge: these packages now depend on each other</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="245.5879" x="22073.9" y="1496.2998">(bidirectional coupling / cycle risk).</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.9912" x="22073.9" y="1512.5967">Fix:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="311.9238" x="22107.3414" y="1512.5967">Verify this cross-boundary call is intentional.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="332.459" x="22073.9" y="1528.8936">Consider routing through an intermediate layer</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="220.2061" x="22073.9" y="1545.1904">or using dependency inversion.</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="1297" id="ent0372"><rect fill="#FEF2F2" height="147.2109" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="651.6592" x="22067.4" y="2931"/><rect fill="#FECACA" height="25.1328" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="651.6592" x="22067.4" y="2931"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="651.6592" x="22067.4" y="2950.1328"/><rect fill="none" height="147.2109" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="651.6592" x="22067.4" y="2931"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="321.2485" x="22232.6053" y="2948.0669">&#127919;&#160;Structural&#160;Regression:&#160;Stable&#160;contract&#160;modified</text><line stroke="#F9A825" stroke-width="1" x1="22068.4" x2="22718.0592" y1="2956.1328" y2="2956.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="22073.4" y="2973.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22169.0826" y="2973.1279">&#160;</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6367" x="22173.5328" y="2973.1279">RepairHistory</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="167.4463" x="22286.6197" y="2973.1279">removed public method</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="635.209" x="22073.4" y="2989.4248">newSession(Node,&#8239;TableReference,&#8239;UUID,&#8239;LongTokenRange,&#8239;Set&amp;lt;DriverNode&gt;)</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22708.609" y="2989.4248">.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="319.5049" x="22073.4" y="3005.7217">11 component(s) in the parsed scope depend</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="87.6094" x="22073.4" y="3022.0186">on this type.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.9912" x="22073.4" y="3038.3154">Fix:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="326.5596" x="22106.8414" y="3038.3154">Review the API contract changes for backward</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="299.2363" x="22073.4" y="3054.6123">compatibility. Consider a deprecation path</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="168.5059" x="22073.4" y="3070.9092">for removed signatures.</text></g><!--class surfaced_note_2--><g class="entity" data-qualified-name="surfaced_note_2" data-source-line="1301" id="ent0374"><rect fill="#FEF2F2" height="130.9141" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="697.3613" x="22138.9" y="1712.5"/><rect fill="#FECACA" height="25.1328" rx="6" ry="6" stroke="#FECACA" stroke-width="1" width="697.3613" x="22138.9" y="1712.5"/><rect fill="#FECACA" height="6" stroke="#FECACA" stroke-width="1" width="697.3613" x="22138.9" y="1731.6328"/><rect fill="none" height="130.9141" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="697.3613" x="22138.9" y="1712.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="691.3613" x="22141.9" y="1729.5669">&#127919;&#160;Structural&#160;Regression:&#160;README.md:&#160;Calls&#160;`RepairScheduler.putConfigurations()`&#160;to&#160;keep&#160;jobs&#160;up&#160;to&#160;date</text><line stroke="#F9A825" stroke-width="1" x1="22139.9" x2="22835.2613" y1="1737.6328" y2="1737.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="22144.9" y="1754.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="73.9375" x="22245.0328" y="1754.6279">introduces</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.5264" x="22323.4205" y="1754.6279">NodeWorker</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="107.126" x="22426.3971" y="1754.6279">-&gt; and 1 other,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="195.9248" x="22144.9" y="1770.9248">which the cited rule forbids.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.9912" x="22144.9" y="1787.2217">Fix:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="339.0488" x="22178.3414" y="1787.2217">This new dependency contradicts a dependency</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="348.1543" x="22144.9" y="1803.5186">rule stated in the repo's own docs. Route through</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="311.7393" x="22144.9" y="1819.8154">an allowed collaborator, or update the doc if</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="171.8896" x="22144.9" y="1836.1123">the rule no longer holds.</text></g><!--class surfaced_note_3--><g class="entity" data-qualified-name="surfaced_note_3" data-source-line="1306" id="ent0377"><rect fill="#FFFBEB" height="244.9922" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="1826.2236" x="22754.4" y="2882"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="1826.2236" x="22754.4" y="2882"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="1826.2236" x="22754.4" y="2901.1328"/><rect fill="none" height="244.9922" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="1826.2236" x="22754.4" y="2882"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="303.145" x="23515.9393" y="2899.0669">&#9888;&#65039;&#160;Review&#160;Hotspot:&#160;Component&#160;scope&#160;widened</text><line stroke="#F9A825" stroke-width="1" x1="22755.4" x2="24579.6236" y1="2907.1328" y2="2907.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="22760.4" y="2924.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22856.0826" y="2924.1279">&#160;</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6367" x="22860.5328" y="2924.1279">RepairHistory</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="108.0967" x="22973.6197" y="2924.1279">now references</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="457.3789" x="22760.4" y="2940.4248">com.ericsson.bss.cassandra.ecchronos.utils.enums.repair</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="303.4678" x="22760.4" y="2956.7217">for the first time, having previously worked</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="306.8174" x="22760.4" y="2973.0186">across 2 namespaces without it. Check that</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="224.1299" x="22760.4" y="2989.3154">this is the component's job. The</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6367" x="22988.9801" y="2989.3154">RepairHistory</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="261.7617" x="22760.4" y="3005.6123">interface removed the public method</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="635.209" x="22760.4" y="3021.9092">newSession(Node,&#8239;TableReference,&#8239;UUID,&#8239;LongTokenRange,&#8239;Set&amp;lt;DriverNode&gt;)</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="23395.609" y="3021.9092">.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="400.6406" x="22760.4" y="3038.2061">11 components in the parsed scope depend on this type,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="371.8955" x="22760.4" y="3054.5029">and this removal will cause compilation failures in all</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="222.626" x="22760.4" y="3070.7998">of them. The new overload with</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="89.6396" x="22987.4762" y="3070.7998">RepairType</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="46.4229" x="23081.566" y="3070.7998">is no...</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.9912" x="22760.4" y="3087.0967">Fix:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="293.8701" x="22793.8414" y="3087.0967">Restore the removed method as a default</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="344.9209" x="22760.4" y="3103.3936">method that delegates to the new overload, e.g.,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="1809.7734" x="22760.4" y="3119.6904">default&#8239;RepairSession&#8239;newSession(Node&#8239;node,&#8239;TableReference&#8239;tableRef,&#8239;UUID&#8239;jobId,&#8239;LongTokenRange&#8239;range,&#8239;Set&amp;lt;DriverNode&gt;&#8239;participants)&#8239;{&#8239;return&#8239;newSession(node,&#8239;tableRef,&#8239;jobId,&#8239;range,&#8239;participants,&#8239;RepairType.UNKNOWN);&#8239;}</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="24570.1734" y="3119.6904">.</text></g><!--class surfaced_note_4--><g class="entity" data-qualified-name="surfaced_note_4" data-source-line="1310" id="ent0379"><rect fill="#FFFBEB" height="293.8828" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="469.3789" x="22067.9" y="837.5"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="469.3789" x="22067.9" y="837.5"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="469.3789" x="22067.9" y="856.6328"/><rect fill="none" height="293.8828" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="469.3789" x="22067.9" y="837.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="303.145" x="22151.0169" y="854.5669">&#9888;&#65039;&#160;Review&#160;Hotspot:&#160;Component&#160;scope&#160;widened</text><line stroke="#F9A825" stroke-width="1" x1="22068.9" x2="22536.2789" y1="862.6328" y2="862.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="22073.9" y="879.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22169.5826" y="879.6279">&#160;</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="171.1582" x="22174.0328" y="879.6279">IncrementalRepairJob</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="108.0967" x="22349.6412" y="879.6279">now references</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="392.3213" x="22073.9" y="895.9248">com.ericsson.bss.cassandra.ecchronos.core.table</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22466.2213" y="895.9248">,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="457.3789" x="22073.9" y="912.2217">com.ericsson.bss.cassandra.ecchronos.utils.enums.repair</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="303.4678" x="22073.9" y="928.5186">for the first time, having previously worked</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="336.8135" x="22073.9" y="944.8154">across 6 namespaces without it. Check that this</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="163.6455" x="22073.9" y="961.1123">is the component's job.</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="171.1582" x="22241.9957" y="961.1123">IncrementalRepairJob</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="34.7061" x="22417.6041" y="961.1123">grew</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="366.8369" x="22073.9" y="977.4092">by 17 WMC and 12 EC, and now references two new</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="22073.9" y="993.7061">namespaces (</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="80.0898" x="22171.8795" y="993.7061">core.table</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22251.9693" y="993.7061">,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="145.1475" x="22260.8697" y="993.7061">utils.enums.repair</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="56.5879" x="22406.0172" y="993.7061">) for the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="225.3057" x="22073.9" y="1010.0029">first time. It directly depends on</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6367" x="22303.6559" y="1010.0029">RepairHistory</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22412.2926" y="1010.0029">,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175.7656" x="22073.9" y="1026.2998">RepairHistoryProvider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22249.6656" y="1026.2998">,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.7002" x="22258.566" y="1026.2998">RepairEntry</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="89.0791" x="22352.2662" y="1026.2998">, `RepairSt...</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.9912" x="22073.9" y="1042.5967">Fix:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="338.3379" x="22107.3414" y="1042.5967">Extract repair history recording into a dedicated</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="180.1543" x="22073.9" y="1058.8936">RepairHistoryRecorder</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="176.9072" x="22258.5045" y="1058.8936">collaborator. Inject it into</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="171.1582" x="22073.9" y="1075.1904">IncrementalRepairJob</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="174.624" x="22249.5084" y="1075.1904">instead of having the job</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="114.126" x="22073.9" y="1091.4873">directly manage</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="108.6367" x="22192.4762" y="1091.4873">RepairHistory</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22301.1129" y="1091.4873">,</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175.7656" x="22310.0133" y="1091.4873">RepairHistoryProvider</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22485.7789" y="1091.4873">,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="26.3389" x="22073.9" y="1107.7842">and</text><text fill="#000000" filter="url(#b1h0kaia8czgjc3)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.7002" x="22104.6891" y="1107.7842">RepairEntry</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="256.4707" x="22198.3893" y="1107.7842">. This would reduce EC and keep the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="224