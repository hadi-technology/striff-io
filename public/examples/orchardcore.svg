t-size="14" lengthAdjust="spacing" textLength="4.4502" x="1883.4004" y="316.1982">&#160;</text><g transform="translate(1887.8506,299.5)"><linearGradient id="i_51_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_51_r"><rect width="58" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="47" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="245" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">ENC: 0</text><text x="245" y="140" transform="scale(.1)" textLength="370">ENC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1945.8506" y="316.1982">&#160;</text><g transform="translate(1950.3008,299.5)"><linearGradient id="i_52_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_52_r"><rect width="50" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="39" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">AC: 0</text><text x="205" y="140" transform="scale(.1)" textLength="290">AC: 0</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="2000.3008" y="316.1982">&#160;</text><g transform="translate(2004.751,299.5)"><linearGradient id="i_53_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_53_r"><rect width="88" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="45" height="20" fill="#24292E"/><rect x="45" width="43" height="20" fill="#bef5cb"/><rect width="88" height="20" fill="url(#i_53_s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="235" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="350">EC: 10</text><text x="235" y="140" transform="scale(.1)" textLength="350">EC: 10</text><text x="655" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330"></text><text fill="#000" x="655" y="140" transform="scale(.1)" textLength="330">+67%</text></g></g><line stroke="#24292E" stroke-width="1" x1="1637.5" x2="2097.751" y1="323.5" y2="323.5"/></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="266" id="ent0031"><rect fill="#FFFBEB" height="261.2891" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="450.792" x="7" y="654.5"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="450.792" x="7" y="654.5"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="450.792" x="7" y="673.6328"/><rect fill="none" height="261.2891" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="450.792" x="7" y="654.5"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="308.147" x="78.3225" y="671.5669">&#9888;&#65039;&#160;Review&#160;Hotspot&#160;Unusual&#160;builder&#160;dependency</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="456.792" y1="679.6328" y2="679.6328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="13" y="696.6279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="208.3799" x="113.1328" y="696.6279">adds a weak association from</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="207.0605" x="13" y="712.9248">PlacementLocationBuilder</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="74.8672" x="224.5107" y="712.9248">to the new</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="303.8281" y="712.9248">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="383.0996" x="13" y="729.2217">struct, which is the weakest edge in the changed code</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="347.3613" x="13" y="745.5186">(score 0.23). The fluent builder now constructs or</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="50.6543" x="13" y="761.8154">returns</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="68.1045" y="761.8154">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="193.2656" x="216.0684" y="761.8154">, but the dependency is not</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="394.3789" x="13" y="778.1123">modeled as composition &#8212; atypical for a builder owning</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="343.6973" x="13" y="794.4092">its output. This obscures ownership and can lead</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="123.6143" x="13" y="810.7061">to lifetime issues.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="13" y="827.0029">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="48.8701" x="70.3945" y="827.0029">Embed</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="123.7148" y="827.0029">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="134.7227" x="13" y="843.2998">as a private field in</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="207.0605" x="152.1729" y="843.2998">PlacementLocationBuilder</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="168.8135" x="13" y="859.5967">and construct it from its</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="36.6475" x="186.2637" y="859.5967">Card</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="222.9111" y="859.5967">,</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.2129" x="231.8115" y="859.5967">Column</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="35.2393" x="291.0244" y="859.5967">, and</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="29.0186" x="330.7139" y="859.5967">Tab</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="107.6387" x="13" y="875.8936">methods. Make</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="53.0537" x="125.0889" y="875.8936">Build()</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="205.7959" x="182.5928" y="875.8936">directly assign the composed</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="13" y="892.1904">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="165.4141" y="892.1904">to</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="113.9277" x="183.9189" y="892.1904">PlacementInfo</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="144.0332" x="297.8467" y="892.1904">, removing the weak</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="302.1211" x="13" y="908.4873">association and making ownership explicit.</text></g><!--class surfaced_note_2--><g class="entity" data-qualified-name="surfaced_note_2" data-source-line="271" id="ent0034"><rect fill="#FFFBEB" height="310.1797" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="401.3135" x="171" y="1433"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="401.3135" x="171" y="1433"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="401.3135" x="171" y="1452.1328"/><rect fill="none" height="310.1797" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="401.3135" x="171" y="1433"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="331.6777" x="205.8179" y="1450.0669">&#9888;&#65039;&#160;Review&#160;Hotspot&#160;PlacementInfo&#160;complexity&#160;surge</text><line stroke="#F9A825" stroke-width="1" x1="172" x2="571.3135" y1="1458.1328" y2="1458.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="177" y="1475.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="272.6826" y="1475.1279">&#160;</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="113.9277" x="277.1328" y="1475.1279">PlacementInfo</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="160.6514" x="391.0605" y="1475.1279">'s EC jumped from 6 to</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="327.5303" x="177" y="1491.4248">15 (EC +9) and WMC from 28 to 78 due to this</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="194.4551" x="177" y="1507.7217">PR. The new aggregation to</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="375.9053" y="1507.7217">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="11.1836" x="528.3193" y="1507.7217">is</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="148.1143" x="177" y="1524.0186">a contributing factor.</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="113.9277" x="329.5645" y="1524.0186">PlacementInfo</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="52.5889" x="447.9424" y="1524.0186">already</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="329.752" x="177" y="1540.3154">handles location parsing and multiple defaults;</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="48.002" x="177" y="1556.6123">adding</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="229.4521" y="1556.6123">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="182.5332" x="381.8662" y="1556.6123">increases its coupling and</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="355.0791" x="177" y="1572.9092">responsibility, risking a god class anti-pattern. The</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="389.3135" x="177" y="1589.2061">advisory edge score (0.32) confirms this dependency is</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="144.0264" x="177" y="1605.5029">structurally unusual.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="177" y="1621.7998">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="37.543" x="234.3945" y="1621.7998">Move</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="276.3877" y="1621.7998">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="335.918" x="177" y="1638.0967">parsing and storage into a new dedicated class,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="30.8506" x="177" y="1654.3936">e.g.,</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="210.3145" x="212.3008" y="1654.3936">GroupingMetadataHandler</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="121.3652" x="422.6152" y="1654.3936">, within the same</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="63.7998" x="177" y="1670.6904">package.</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="113.9277" x="245.25" y="1670.6904">PlacementInfo</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="160.9043" x="363.6279" y="1670.6904">should delegate to this</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="227.0283" x="177" y="1686.9873">handler rather than aggregating</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.9639" x="408.4785" y="1686.9873">GroupingMetadata</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="189.0205" x="177" y="1703.2842">directly. This would reduce</text><text fill="#000000" filter="url(#b1k6ss8qhynx671)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="113.9277" x="370.4707" y="1703.2842">PlacementInfo</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="55.8359" x="484.3984" y="1703.2842">'s EC by</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="358.3809" x="177" y="1719.5811">at least 1 and WMC by approximately 10, restoring</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="212.0371" x="177" y="1735.8779">better separation of concerns.</text></g><!--link OrchardCore-Tests-DisplayManagement-Decriptors-GroupingMetadataTests to OrchardCore-DisplayManagement-Descriptors-GroupingMetadata--><g class="link" data-entity-1="ent0016" data-entity-2="ent0005" data-link-type="dependency" data-source-line="240" id="lnk19"><path codeLine="240" d="M942.66,348.06 C826.57,382.87 707.25,442.13 635.5,543 C475.7,767.66 615.5,887.3 615.5,1163 C615.5,1163 615.5,1163 615.5,2250 C615.5,2449.86 1154.4666,2513.338 1570.3766,2532.908" fill="none" id="OrchardCore-Tests-DisplayManagement-Decriptors-GroupingMetadataTests-to-OrchardCore-DisplayManagement-Descriptors-GroupingMetadata" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1576.37,2533.19,1567.568,2528.7714,1571.3755,2532.955,1567.1919,2536.7626,1576.37