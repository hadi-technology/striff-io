24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="205" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">AC: 2</text><text x="205" y="140" transform="scale(.1)" textLength="290">AC: 2</text></g></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="2385.3008" y="727.7764">&#160;</text><g transform="translate(2389.751,711.0781)"><linearGradient id="i_29_s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="i_29_r"><rect width="56" height="20" rx="3" fill="#fff"/></clipPath><g  transform="scale(0.9)"><rect width="45" height="20" fill="#24292E"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110" transform="scale(0.9)"><text x="235" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="350">EC: 10</text><text x="235" y="140" transform="scale(.1)" textLength="350">EC: 10</text></g></g><line stroke="#24292E" stroke-width="1" x1="2030.5" x2="2677.2744" y1="735.0781" y2="735.0781"/><g data-visibility-modifier="PACKAGE_PRIVATE_FIELD"><polygon fill="none" points="2040.5,744.7266,2036.5,750.7266,2044.5,750.7266" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="156.8711" x="2049.5" y="752.0732">LicenseChecked : bool</text><line stroke="#24292E" stroke-width="1" x1="2030.5" x2="2677.2744" y1="759.375" y2="759.375"/><g data-visibility-modifier="PACKAGE_PRIVATE_METHOD"><polygon fill="#A0A0A0" points="2040.5,769.0234,2036.5,775.0234,2044.5,775.0234" stroke="#24292E" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="499.0029" x="2049.5" y="776.3701">internal static void CheckLicense(this IServiceProvider serviceProvider)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="2040.5" cy="789.3203" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="327.9199" x="2049.5" y="792.667">public static IServiceCollection AddMediatR(...)</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="2040.5" cy="805.6172" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="327.9199" x="2049.5" y="808.9639">public static IServiceCollection AddMediatR(...)</text></g><!--class surfaced_note_1--><g class="entity" data-qualified-name="surfaced_note_1" data-source-line="150" id="ent0017"><rect fill="#FFFBEB" height="342.7734" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="437.7422" x="7" y="7"/><rect fill="#FDE68A" height="25.1328" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="437.7422" x="7" y="7"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="437.7422" x="7" y="26.1328"/><rect fill="none" height="342.7734" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="437.7422" x="7" y="7"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="277.5703" x="87.0859" y="24.0669">&#9888;&#65039;&#160;P2&#160;Cross-package&#160;licensing&#160;dependency</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="443.7422" y1="32.1328" y2="32.1328"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.6826" x="13" y="49.1279">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="217.957" x="113.1328" y="49.1279">adds direct dependencies from</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="304.9307" x="13" y="65.4248">MediatR.Registration.ServiceRegistrar</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="322.3809" y="65.4248">to</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="279.8291" x="13" y="81.7217">MediatR.Licensing.LicenseAccessor</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="26.3389" x="297.2793" y="81.7217">and</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="282.2764" x="13" y="98.0186">MediatR.Licensing.LicenseValidator</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="79.7139" x="295.2764" y="98.0186">, creating a</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="366.9805" x="13" y="114.3154">cross-package coupling that mixes registration logic</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="168.3281" x="13" y="130.6123">with licensing concerns.</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.5781" x="185.7783" y="130.6123">ServiceRegistrar</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="81.7852" x="321.8066" y="130.6123">already has</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="420.8955" x="13" y="146.9092">high complexity (WMC 224) and 31 outgoing dependencies;</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="345.5566" x="13" y="163.2061">adding licensing-specific dependencies increases</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="341.4688" x="13" y="179.5029">its responsibility and makes it harder to test and</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="341.4893" x="13" y="195.7998">maintain. Based on the partial analysis, this new</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="309.6748" x="13" y="212.0967">coupling is visible and should be addressed.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.9443" x="13" y="228.3936">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="352.8301" x="13" y="244.6904">Extract the licensing validation logic from the new</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="256.6689" x="13" y="260.9873">AddMediatRClassesWithTimeout</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="164.623" x="274.1191" y="260.9873">method into a separate</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="137.0811" x="13" y="277.2842">ILicenseValidator</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="249.3545" x="154.5313" y="277.2842">interface and implementation, then</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="83.5488" x="13" y="293.5811">inject it into</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.5781" x="100.999" y="293.5811">ServiceRegistrar</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="105.2598" x="237.0273" y="293.5811">via constructor</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="326.1289" x="13" y="309.8779">or method parameter. This removes the direct</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="108.1172" x="13" y="326.1748">dependency on</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="129.4248" x="125.5674" y="326.1748">LicenseAccessor</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="26.3389" x="259.4424" y="326.1748">and</text><text fill="#000000" filter="url(#b1kd3cymhfp4w90)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="131.8721" x="290.2314" y="326.1748">LicenseValidator</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="258.9727" x="13" y="342.4717">and keeps registration logic focused.</text></g><!--link MediatR-Registration-ServiceRegistrar to Microsoft-Extensions-DependencyInjection-MediatRServiceCollectionExtensions--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" data-link-type="dependency" data-source-line="131" id="lnk12"><path codeLine="131" d="M1694.0257,460.7909 C1782.3657,470.2809 1876.9,485.04 1966,510 C2006.86,521.45 2043.3683,534.2488 2084.0583,550.7188" fill="none" id="MediatR-Registration-ServiceRegistrar-Microsoft-Extensions-DependencyInjection-MediatRServiceCollectionExtensions" stroke="#464646" stroke-width="1"/><polygon fill="#464646" points="1688.06,460.15,1696.5813,465.0884,1693.0314,460.6841,1697.4358,457.1342,1688.06,460.15" stroke="#464646" stroke-width="1"/><polygon fill="#464646" points="2089.62,552.97,2082.7783,545.8854,2084.9853,551.094,2079.7767,553.301,2089.62,552.97" stroke="#464646" stroke-width="1"/></g><!--link MediatR-Registration-ServiceRegistrar to MediatR-Licensing-LicenseAccessor--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" data-link-type="dependency" data-source-line="132" id="lnk13"><path codeLine="132" d="M1215.83,462.88 C1105.5,473.63 987.5,489.3 937,510 C899.6,525.34 867.7959,544.8846 835.2859,569.3246" fill="none" id="MediatR-Registration-ServiceRegistrar-to-MediatR-Licensing-LicenseAccessor" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="830.49,572.93,840.0875,570.7191,834.4866,569.9255,835.2803,564.3246,830.49,572.93" stroke="#00CC00" stroke-width="1"/></g><!--link MediatR-Registration-ServiceRegistrar to MediatR-Licensing-LicenseValidator--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" data-link-type="dependency" data-source-line="133" id="lnk14"><path codeLine="133" d="M1452,478.16 C1452,515.15 1452,569.81 1452,615.62" fill="none" id="MediatR-Registration-ServiceRegistrar-to-MediatR-Licensing-LicenseValidator" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="1452,621.62,1456,612.62,1452,616.62,1448,612.62,1452,621.62" stroke="#00CC00" stroke-width="1"/><