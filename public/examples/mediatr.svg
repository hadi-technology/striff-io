ght="bold" lengthAdjust="spacing" textLength="5.1133" x="2035.5" y="601.9951">/</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="572.2227" x="2045.4873" y="601.9951">/ Extensions to scan for MediatR handlers and registers them. /// - Scans</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="623.5605" x="2035.5" y="618.292">for any handler interface implementations and registers them as /// - Scans for</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="636.7744" x="2035.5" y="634.5889">any and implementations and registers them as transient instances /// Registers</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="614.1064" x="2035.5" y="650.8857">as a transient instance /// After calling AddMediatR you can use the container</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="615.7061" x="2035.5" y="667.1826">to resolve an instance. /// This does not scan for any instances including and .</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="577.3154" x="2035.5" y="683.4795">/// To register behaviors, use the with the open generic or closed generic</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="69.2002" x="2035.5" y="699.7764">types. ///</text><line stroke="#24292E" stroke-width="1" x1="2030.5" x2="2677.2744" y1="707.0781" y2="707.0781"/><g transform="translate(2035.5,711.0781)"><linearGradient id="i_24_s" x2="0" y2="100%"><stop offset="0" stop-col