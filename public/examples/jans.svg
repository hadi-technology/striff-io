.8872" x="1787" y="1504.1697">removePadding(String) : String</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1519.3056" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="210.0692" x="1787" y="1523.2376">base64urldecode(String) : byte[]</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1538.3735" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="211.5952" x="1787" y="1542.3055">base64urlencode(String) : String</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1557.4415" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="210.1112" x="1787" y="1561.3734">base64urlencode(byte[]) : String</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1576.5094" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="197.4132" x="1787" y="1580.4414">unsignedToBytes(int[]) : byte[]</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1595.5773" fill="#84BE84" rx="3" ry="3" stroke="#038048" stroke-width="1"/></g><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="267.203" x="1787" y="1599.5093">base64urldecodeToString(String) : String</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="1778" cy="1614.6452" fill="#84BE84" rx="3" ry="3" stroke="#0