e="#F9A825" stroke-width="1" width="350.5047" x="7" y="1055"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="243.3992" x="60.5528" y="1073.897">&#127919;&#160;P1&#160;Increased&#160;complexity&#160;in&#160;core&#160;classes</text><line stroke="#F9A825" stroke-width="1" x1="8" x2="356.5047" y1="1082.706" y2="1082.706"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="13" y="1101.672">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="154.0414" x="100.7797" y="1101.672">PR adds 5 WMC to both</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="338.5047" x="13" y="1120.7399">SignatureAlgorithm.java and Base64Util.java, which</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="314.3268" x="13" y="1139.8078">already have high afferent coupling (220 and 44</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="305.6188" x="13" y="1158.8757">dependents respectively). Any change to these</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="307.4668" x="13" y="1177.9436">high-impact classes now has even wider reach,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="305.7869" x="13" y="1197.0115">raising regression risk across the Janssen Auth</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="45.9058" x="13" y="1216.0795">Server.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="13" y="1235.1474">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="216.0332" x="62.8958" y="1235.1474">Add a dedicated abstract base or</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="319.1988" x="13" y="1254.2153">helper class for algorithm-specific behavior (e.g.,</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="326.5487" x="13" y="1273.2832">coordinate-length logic) to reduce future changes</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="197.3992" x="13" y="1292.3511">to these high-afferent classes.</text></g><!--class surfaced_note_2--><g class="entity" data-qualified-name="surfaced_note_2" data-source-line="179" id="ent0023"><rect fill="#FFFBEB" height="226.3852" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="370.9026" x="570" y="7"/><rect fill="#FDE68A" height="27.706" rx="6" ry="6" stroke="#FDE68A" stroke-width="1" width="370.9026" x="570" y="7"/><rect fill="#FDE68A" height="6" stroke="#FDE68A" stroke-width="1" width="370.9026" x="570" y="28.706"/><rect fill="none" height="226.3852" rx="6" ry="6" stroke="#F9A825" stroke-width="1" width="370.9026" x="570" y="7"/><text fill="#5D4037" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="294.5345" x="608.1841" y="25.897">&#9888;&#65039;&#160;P2&#160;Test&#160;adds&#160;coupling&#160;to&#160;high-afferent&#160;classes</text><line stroke="#F9A825" stroke-width="1" x1="571" x2="939.9026" y1="34.706" y2="34.706"/><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="84.1397" x="576" y="53.672">Why&#8239;review:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="251.999" x="663.7797" y="53.672">The new test ECDSAPublicKeyTest.java</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="186.9973" x="576" y="72.7399">creates weak associations to</text><text fill="#000000" filter="url(#bqgq70g046xxo2)" font-family="monospace" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="139.5095" x="766.6373" y="72.7399">SignatureAlgorithm</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="25.1159" x="909.7867" y="72.7399">and</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="319.7448" x="576" y="91.8078">Base64Util, both of which already have very high</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="324.9528" x="576" y="110.8757">afferent coupling. This increases the downstream</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="298.8988" x="576" y="129.9436">impact of changes to these core classes, even</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="148.3714" x="576" y="149.0115">for test-only additions.</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.2558" x="576" y="168.0795">Check:</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="86.6597" x="625.8958" y="168.0795">Keep the test</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="338.6307" x="576" y="187.1474">focused on testing only ECDSAPublicKey coordinate</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="319.2548" x="576" y="206.2153">padding; consider using mocks or isolation if the</text><text fill="#000000" font-family="Consolas,Menlo,Liberation Mono" font-size="14" lengthAdjust="spacing" textLength="304.7368" x="576" y="225.2832">dependencies become a maintenance burden.</text></g><!--link io-jans-as-model-crypto-signature-ECDSAPublicKeyTest to io-jans-as-model-crypto-signature-SignatureAlgorithm--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="152" id="lnk12"><path codeLine="152" d="M544.52,504.16 C519.64,519.84 497.46,539.46 481.5,564 C300.83,841.76 528.579,1240.5602 652.749,1421.8102" fill="none" id="io-jans-as-model-crypto-signature-ECDSAPublicKeyTest-to-io-jans-as-model-crypto-signature-SignatureAlgorithm" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="656.14,1426.76,654.3534,1417.0745,653.3141,1422.6351,647.7536,1421.5959,656.14,1426.76" stroke="#00CC00" stroke-width="1"/></g><!--link io-jans-as-model-crypto-signature-ECDSAPublicKeyTest to io-jans-as-model-util-Base64Util--><g class="link" data-entity-1="ent0006" data-entity-2="ent0011" data-link-type="dependency" data-source-line="153" id="lnk13"><path codeLine="153" d="M979.74,485.91 C1404.45,573.78 2296.06,787.3 2432.5,1055 C2481.95,1152.02 2486.58,1205.49 2432.5,1300 C2411.07,1337.46 2385.286,1365.5291 2350.766,1392.2291" fill="none" id="io-jans-as-model-crypto-signature-ECDSAPublicKeyTest-to-io-jans-as-model-util-Base64Util" stroke="#00CC00" stroke-width="1"/><polygon fill="#00CC00" points="2346.02,1395.9,2355.5863,1393.5577,2349.975,1392.8409,2350.6918,1387.2297,2346.02,1395.9" stroke="#00CC00" stroke-width="1"/></g><!--link io-jans-as-model-crypto-signature-ECDSAPublicKeyTest to io-jans-as-model-crypto-signature-ECDSAPublicKey--><g class="link" data-entity-1="ent0006" data-entity-2="ent